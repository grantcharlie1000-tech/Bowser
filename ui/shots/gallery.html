<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Composer menus</title>
<style>
  html, body { margin: 0; background: #17181b; color: #e8eaed; font: 13px/1.4 Segoe UI, sans-serif; }
  main { display: flex; gap: 28px; align-items: flex-start; padding: 28px; }
  figure { margin: 0; }
  figcaption { margin: 0 0 8px; color: #9aa0a6; }
  iframe { width: 340px; height: 240px; border: 0; background: #202124; border-radius: 12px; }
</style>
</head>
<body>
<main>
  <figure>
    <figcaption>New workspace</figcaption>
    <iframe src="/shots/frame.html?view=popup&amp;composer=workspace" title="New workspace"></iframe>
  </figure>
  <figure>
    <figcaption>Add web app</figcaption>
    <iframe src="/shots/frame.html?view=popup&amp;composer=add" title="Add web app"></iframe>
  </figure>
  <figure>
    <figcaption>Edit web app</figcaption>
    <iframe src="/shots/frame.html?view=popup&amp;composer=edit" title="Edit web app"></iframe>
  </figure>
</main>
</body>
</html>
