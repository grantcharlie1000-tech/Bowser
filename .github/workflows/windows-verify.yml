name: Verify downloaded v0.0.27 runtime (isolated)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  published-runtime:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Run downloaded public binaries only in isolated disposable profiles
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./benchmarks/scripts/verify-published-v27-runtime.ps1
      - name: Preserve exact runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: published-v27-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/published-v27-evidence
          retention-days: 14
          if-no-files-found: error