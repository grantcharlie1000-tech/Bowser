name: Verify Windows release candidate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Two kinds of change skip the Windows build here; everything else, and any
  # doubt, runs the full verification.
  # - pin: the only change is stable/release.json (the stable pin PR, opened by
  #   a person or by release.yml's pin job, which dispatches this workflow on its
  #   branch; prepare-release.yml does the same for bump branches). The rules of the Rust test the_shown_version_follows_the_pinned_release,
  #   the PIN_REVISION agreement and the allow-list are checked instead.
  # - bump: the tree is byte-identical to running the base branch's own
  #   `tools/release.py bump X.Y.Z`. Merging it starts release.yml, which runs
  #   the full Windows verification on that exact commit before publishing.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      heavy: ${{ steps.diff.outputs.heavy }}
      kind: ${{ steps.diff.outputs.kind }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Classify the change (fail closed to full verification)
        id: diff
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -uo pipefail
          kind=full
          pin_only() {
            local raw
            raw="$(git diff --raw --no-renames --no-abbrev "$1" "$2")" || return 1
            echo "$raw"
            [ "$(printf '%s\n' "$raw" | grep -c .)" = 1 ] &&
              printf '%s\n' "$raw" | grep -Eq '^:100644 100644 [0-9a-f]{40} [0-9a-f]{40} M'$'\t''stable/release\.json$'
          }
          # True when HEAD's tree is exactly what the base's own release.py bump
          # produces for HEAD's Cargo version (trusted code: it comes from the base).
          bump_only() {
            local version base="$RUNNER_TEMP/base"
            git cat-file -e "$1:tools/release.py" 2>/dev/null || return 1
            version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["package"]["version"])')" || return 1
            [ -n "$version" ] && git worktree add -q --detach "$base" "$1" &&
              python3 "$base/tools/release.py" bump "$version" &&
              git -C "$base" add -A && [ "$(git -C "$base" write-tree)" = "$(git rev-parse 'HEAD^{tree}')" ]
          }
          parents="$(git rev-list --parents -n 1 HEAD | wc -w)"
          base=
          if [ "$EVENT_NAME" = pull_request ] && [ "$parents" = 3 ]; then
            # HEAD is the test merge commit; HEAD^1 is the base it merges into.
            base=HEAD^1
          elif [ "$EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF" != refs/heads/main ] && [ "$parents" = 2 ]; then
            # A branch opened by release.yml (pin) or prepare-release.yml (bump):
            # light only when it is one commit directly on main's current head.
            main="$(git ls-remote origin refs/heads/main | cut -f1)" || main=
            if [ -n "$main" ] && [ "$(git rev-parse HEAD^1)" = "$main" ]; then base=HEAD^1; fi
          fi
          if [ -n "$base" ]; then
            if pin_only "$base" HEAD; then
              kind=pin
            elif bump_only "$base"; then
              kind=bump
            fi
          fi
          heavy=true
          [ "$kind" != full ] && heavy=false
          printf 'kind=%s\nheavy=%s\n' "$kind" "$heavy" | tee -a "$GITHUB_OUTPUT"
      - name: Check the pin against the source it is merged into
        if: steps.diff.outputs.kind == 'pin'
        run: python3 tools/release.py check-pin

  rust-native:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve fingerprinted source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Parse native theme script before running checks
        run: |
          $tokens = $null
          $parseErrors = $null
          foreach ($script in @('test-native-theme-flow.ps1')) {
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $pwd "benchmarks/scripts/$script"),
              [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { $parseErrors | Format-List; throw "$script does not parse." }
          }
      - name: Install official Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain installation failed.' }
          rustc +stable --version
          cargo +stable --version
      - name: Diagnose focused native theme persistence before aggregate tests
        timeout-minutes: 15
        run: ./benchmarks/scripts/test-native-theme-flow.ps1
      - name: Save focused Rust logs and timeout process evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-theme-diagnostics-${{ github.sha }}
          path: ${{ runner.temp }}/bowser-theme-tests/
          if-no-files-found: warn
          retention-days: 14
      - name: Test default native Windows source
        timeout-minutes: 10
        run: cargo +stable test --locked

  rust-html:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve fingerprinted source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install official Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain installation failed.' }
          rustc +stable --version
          cargo +stable --version
      - name: Test shipping HTML-default Windows source
        timeout-minutes: 10
        run: cargo +stable test --locked --features html-chrome-default
      - name: Check Windows source with Clippy
        run: cargo +stable clippy --locked --features html-chrome-default -- -D warnings


  ui:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      matrix:
        shard: [1, 2]
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve fingerprinted source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install locked UI dependencies
        working-directory: ui
        run: npm ci --no-audit --no-fund
      - name: Typecheck UI
        if: matrix.shard == 1
        working-directory: ui
        run: npm run typecheck
      - name: Lint UI
        if: matrix.shard == 1
        working-directory: ui
        run: npm run lint
      - name: Require Edge for browser-backed regression tests
        run: |
          $edge = @(
            'C:/Program Files (x86)/Microsoft/Edge/Application/msedge.exe',
            'C:/Program Files/Microsoft/Edge/Application/msedge.exe'
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $edge) { throw 'Microsoft Edge is required; browser-backed suites must not silently skip.' }
          "BOWSER_TEST_EDGE=$edge" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Check isolated CJK reader baseline (unchanged budget)
        if: matrix.shard == 2
        working-directory: ui
        run: |
          node --test --test-concurrency=1 --test-name-pattern="reader: article-cjk.html" test/reader.mjs
      - name: Test UI (this shard of the files in package.json's test script)
        working-directory: ui
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          # Each `node --test ...` command in the test script runs with --test-shard,
          # so the two shards together run every listed file exactly once.
          $script = node -p "require('./package.json').scripts.test"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read the UI test script.' }
          foreach ($cmd in ($script -split ' && ')) {
            $words = @($cmd.Trim() -split '\s+')
            if ($words.Count -lt 3 -or $words[0] -cne 'node' -or $words[1] -cne '--test' -or @($words | Where-Object { $_ -cnotmatch '^[A-Za-z0-9_./=-]+$' }).Count) { throw "Unexpected UI test command: $cmd" }
            & node --test "--test-shard=$($env:SHARD)/2" @($words[2..($words.Count - 1)])
            if ($LASTEXITCODE -ne 0) { throw 'UI tests failed.' }
          }
      - name: Test shipped Shield extension
        if: matrix.shard == 2
        run: node --test extensions/bowser-shield/test/run-tests.js
      - name: Install locked Spoiler Firewall browser test dependencies
        if: matrix.shard == 2
        working-directory: extensions/spoiler-firewall/test/e2e
        run: npm ci --no-audit --no-fund
      - name: Verify text-only video filtering and live spoiler term updates in Edge
        if: matrix.shard == 2
        working-directory: extensions/spoiler-firewall
        run: |
          node build/build.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Spoiler Firewall build failed.' }
          node test/e2e/youtube.mjs
          if ($LASTEXITCODE -ne 0) { throw 'YouTube spoiler regression tests failed.' }
          node test/e2e/bowser-feed.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Live spoiler term update tests failed.' }


  ui-repro:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve fingerprinted source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install locked UI dependencies
        working-directory: ui
        run: npm ci --no-audit --no-fund
      - name: Rebuild embedded UI
        working-directory: ui
        run: npm run build
      - name: Verify committed UI is reproducible
        run: |
          git diff --exit-code -- ui/src/icons.gen.ts ui/dist ui/dist.manifest
          if ($LASTEXITCODE -ne 0) { throw 'Rebuilt UI differs from committed source/assets.' }

  build:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve fingerprinted source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Parse native smoke script before running checks
        run: |
          $tokens = $null
          $parseErrors = $null
          foreach ($script in @('verify-release-candidate.ps1')) {
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $pwd "benchmarks/scripts/$script"),
              [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { $parseErrors | Format-List; throw "$script does not parse." }
          }
      - name: Install official Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain installation failed.' }
          rustc +stable --version
          cargo +stable --version
      # Node only runs the smoke test's local fixture server; no npm install here.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Build release candidate
        run: cargo +stable build --release --locked --bin bowser --features html-chrome-default
      - name: Smoke exact native release executable in isolated profile
        run: pwsh -NoProfile -File benchmarks/scripts/verify-release-candidate.ps1 -Out "$env:RUNNER_TEMP/bowser-release-smoke"
      - name: Save native smoke evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bowser-native-smoke-${{ github.sha }}
          path: ${{ runner.temp }}/bowser-release-smoke/
          if-no-files-found: warn
          retention-days: 14
      - name: Record immutable build identity
        run: |
          New-Item -ItemType Directory -Force release-candidate | Out-Null
          Copy-Item target/release/bowser.exe release-candidate/Bowser.exe
          $file = Get-Item release-candidate/Bowser.exe
          $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $source = (git rev-parse HEAD).Trim()
          $smokePath = Join-Path $env:RUNNER_TEMP 'bowser-release-smoke/native-smoke.json'
          $smoke = Get-Content $smokePath -Raw | ConvertFrom-Json
          if ($smoke.status -cne 'passed_bounded_native_smoke' -or $smoke.source_commit -cne $source -or $smoke.executable_sha256 -cne $hash) {
            throw 'Native smoke evidence does not match the candidate.'
          }
          Copy-Item $smokePath release-candidate/native-smoke.json
          $metadata = [ordered]@{
            commit = $source
            workflow_sha = $env:GITHUB_SHA
            run_id = $env:GITHUB_RUN_ID
            run_attempt = $env:GITHUB_RUN_ATTEMPT
            asset = 'Bowser.exe'
            sha256 = $hash
            bytes = $file.Length
            features = 'html-chrome-default'
            smoke_report_sha256 = (Get-FileHash $smokePath -Algorithm SHA256).Hash.ToLowerInvariant()
            smoke_status = $smoke.status
            rustc = (rustc +stable --version)
            built_at_utc = (Get-Date).ToUniversalTime().ToString('o')
            published = $false
          }
          $metadata | ConvertTo-Json | Set-Content -Encoding utf8 release-candidate/build-metadata.json
          "$hash  Bowser.exe" | Set-Content -Encoding ascii release-candidate/SHA256SUMS.txt
      - name: Save verified release candidate (not a publication)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bowser-windows-${{ github.sha }}
          path: release-candidate/
          if-no-files-found: error
          retention-days: 14

  # Keeps the check name "verify" that branch protection may require. It passes
  # only when every heavy job succeeded, or when the change was classified as a
  # light change (pin or exact bump), its checks passed and the heavy jobs were skipped.
  verify:
    needs: [changes, rust-native, rust-html, ui, ui-repro, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require full verification or a checked pin-only change
        shell: bash
        env:
          CHANGES: ${{ needs.changes.result }}
          HEAVY: ${{ needs.changes.outputs.heavy }}
          KIND: ${{ needs.changes.outputs.kind }}
          RESULTS: >-
            ${{ needs.rust-native.result }} ${{ needs.rust-html.result }} ${{ needs.ui.result }}
            ${{ needs.ui-repro.result }} ${{ needs.build.result }}
        run: |
          echo "changes=$CHANGES heavy=$HEAVY rust-native rust-html ui ui-repro build: $RESULTS"
          if [ "$CHANGES" != success ]; then echo 'Change classification failed.' >&2; exit 1; fi
          all() { [ "$(echo $RESULTS | wc -w)" = 5 ] && for r in $RESULTS; do [ "$r" = "$1" ] || return 1; done; }
          if [ "$HEAVY" = false ] && all skipped; then
            echo "Light change ($KIND) passed its checks; release.yml runs the full Windows verification before any publish."; exit 0
          fi
          if [ "$HEAVY" = true ] && all success; then exit 0; fi
          echo 'Windows verification did not pass.' >&2; exit 1
