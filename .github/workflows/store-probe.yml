name: Probe current Store downloads
on:
  pull_request:
    paths:
      - 'src/crx*.rs'
      - 'src/store.rs'
      - 'src/extensions.rs'
      - 'src/extensions/**'
      - 'src/engine/**'
      - 'src/win32/store.rs'
      - '.github/workflows/store-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  download-probe:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve fingerprinted source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install official Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Probe current MV3 listings using detected WebView2 runtime
        run: |
          $env:BOWSER_EXTENSION_TRACE = '1'
          cargo +stable test --locked --lib live_current_mv3_store_downloads -- --ignored --nocapture --test-threads=1 2>&1 | Tee-Object store-download-probe.log
          if ($LASTEXITCODE -ne 0) { throw 'Store diagnostic test failed.' }
      - name: Load real signed packages in disposable extension-enabled profiles
        id: real_packages
        run: |
          $env:BOWSER_EXTENSION_TRACE = '1'
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'bowser-store-isolated-localappdata'
          New-Item -ItemType Directory -Force $env:LOCALAPPDATA | Out-Null
          $env:BOWSER_EXTENSION_MEASURE_ROOT = Join-Path $env:RUNNER_TEMP ('bowser-extension-measurement-' + [guid]::NewGuid().ToString('N'))
          "BOWSER_EXTENSION_MEASURE_ROOT=$env:BOWSER_EXTENSION_MEASURE_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $test = Get-ChildItem target/debug/deps/bowser-*.exe | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          & $test.FullName live_store_current_extension_loads --ignored --nocapture --test-threads=1 2>&1 | Tee-Object store-runtime-probe.log
          if ($LASTEXITCODE -ne 0) { throw 'Real extension load diagnostic failed.' }
      - name: Save real-package functionality diagnostics before later gates
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: store-real-package-diagnostics-${{ github.sha }}
          path: |
            store-download-probe.log
            store-runtime-probe.log
            ${{ runner.temp }}/bowser-extension-link-native/
          if-no-files-found: error
          retention-days: 14
      - name: Probe genuine action activeTab through in-process CDP without unsafe flags
        run: |
          $env:BOWSER_EXTENSION_TRACE = '1'
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'bowser-store-isolated-localappdata'
          $test = Get-ChildItem target/debug/deps/bowser-*.exe | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          & $test.FullName live_probe_native_action_active_tab --ignored --nocapture --test-threads=1 2>&1 | Tee-Object store-action-probe.log
          if ($LASTEXITCODE -ne 0) { throw 'Action activeTab feasibility fixture failed.' }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install locked Store renderer dependencies
        working-directory: ui
        run: npm ci --no-audit --no-fund
      - name: Capture real-browser Store rendering, not native installation evidence
        working-directory: ui
        run: node scripts/capture-store.mjs "$env:RUNNER_TEMP/bowser-store-rendering"
      - name: Measure actual native zero versus four extension profiles without benchmark mode
        if: ${{ !cancelled() && steps.real_packages.outcome == 'success' && env.BOWSER_EXTENSION_MEASURE_ROOT != '' }}
        run: |
          cargo +stable build --release --locked --bin bowser --features html-chrome-default
          if ($LASTEXITCODE -ne 0) { throw 'Release executable for actual extension measurement failed to build.' }
          ./benchmarks/scripts/measure-native-extensions.ps1 -ProfilesRoot $env:BOWSER_EXTENSION_MEASURE_ROOT
      - name: Remove only the disposable package measurement copies
        if: always()
        run: |
          $path = $env:BOWSER_EXTENSION_MEASURE_ROOT
          if ($path) {
            $full = [IO.Path]::GetFullPath($path)
            $allowed = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\') + '\'
            if (-not $full.StartsWith($allowed, [StringComparison]::OrdinalIgnoreCase) -or -not ([IO.Path]::GetFileName($full).StartsWith('bowser-extension-measurement-'))) { throw 'Refusing cleanup outside the disposable measurement root.' }
            if (Test-Path -LiteralPath $full) { Remove-Item -LiteralPath $full -Recurse -Force }
          }
      - name: Save diagnostic evidence, including unavailable packages
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: store-download-probe-${{ github.sha }}
          path: |
            store-download-probe.log
            store-runtime-probe.log
            store-fixture-probe.log
            store-pending-native-probe.log
            store-crash-recovery-probe.log
            store-completed-restart-probe.log
            store-stale-owner-probe.log
            store-fail-closed-environment-probe.log
            store-profile-private-isolation-probe.log
            store-update-probe.log
            store-action-probe.log
            ${{ runner.temp }}/bowser-store-rendering/
            ${{ runner.temp }}/bowser-native-store/
            ${{ runner.temp }}/bowser-extension-metrics/
          if-no-files-found: error
          retention-days: 14

  native-safety:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve fingerprinted source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install official Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Build independent native safety executable without marketplace or resource dependencies
        id: native_build
        run: |
          cargo +stable test --locked --lib --no-run
          if ($LASTEXITCODE -ne 0) { throw 'Native safety executable failed to build.' }
      - name: Authenticate signed originals and preserve unexpected artifact data
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        run: |
          $test = Get-ChildItem target/debug/deps/bowser-*.exe | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          & $test.FullName signed_original_ --nocapture --test-threads=1 2>&1 | Tee-Object store-signed-original-probe.log
          if ($LASTEXITCODE -ne 0) { throw 'Signed-original crypto/filesystem controls failed.' }
      - name: Reject preexisting record temporary files and junctions
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        run: |
          $test = Get-ChildItem target/debug/deps/bowser-*.exe | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          & $test.FullName record_write_ --nocapture --test-threads=1 2>&1 | Tee-Object store-record-temp-probe.log
          if ($LASTEXITCODE -ne 0) { throw 'Record temporary-file preservation controls failed.' }
      - name: Execute update state contract without enabling production updates
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        run: |
          $test = Get-ChildItem target/debug/deps/bowser-*.exe | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          & $test.FullName update_model_ --nocapture --test-threads=1 2>&1 | Tee-Object store-update-model-probe.log
          if ($LASTEXITCODE -ne 0) { throw 'Test-only update state contract failed.' }
      - name: Gate listing authority on actual successful native documents
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        run: |
          $test = Get-ChildItem target/debug/deps/bowser-*.exe | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          & $test.FullName engine::document_gate:: --nocapture --test-threads=1 2>&1 | Tee-Object store-document-gate-unit.log
          if ($LASTEXITCODE -ne 0) { throw 'Native document gate contract failed.' }
          & $test.FullName live_successful_document_gate --ignored --nocapture --test-threads=1 2>&1 | Tee-Object store-document-gate-native.log
          if ($LASTEXITCODE -ne 0) { throw 'Actual native document gate controls failed.' }
      - name: Preserve complete static content-script declarations for consent
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        run: |
          $test = Get-ChildItem target/debug/deps/bowser-*.exe | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          & $test.FullName content_script_review_ --nocapture --test-threads=1 2>&1 | Tee-Object store-content-script-review.log
          if ($LASTEXITCODE -ne 0) { throw 'Complete content-script review controls failed.' }
      - name: Enforce bounded native extension page link parsing and navigation guards
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        run: |
          $test = Get-ChildItem target/debug/deps/bowser-*.exe | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          & $test.FullName native_page_links_ --nocapture --test-threads=1 2>&1 | Tee-Object store-page-links-controls.log
          if ($LASTEXITCODE -ne 0) { throw 'Native page-link parsing/navigation controls failed.' }
      - name: Exercise genuine empty-link notice and stale-menu same-URL reload
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        run: |
          $env:BOWSER_EXTENSION_TRACE = '1'
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'bowser-store-page-links-localappdata'
          New-Item -ItemType Directory -Force $env:LOCALAPPDATA | Out-Null
          $test = Get-ChildItem target/debug/deps/bowser-*.exe | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          & $test.FullName live_probe_native_page_links_guards --ignored --nocapture --test-threads=1 2>&1 | Tee-Object store-page-links-runtime-controls.log
          if ($LASTEXITCODE -ne 0) { throw 'Actual native Page links empty/reload controls failed.' }
      - name: Probe genuine named command delivery without host shortcut interception
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        run: |
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'bowser-store-native-command-localappdata'
          New-Item -ItemType Directory -Force $env:LOCALAPPDATA | Out-Null
          $test = Get-ChildItem target/debug/deps/bowser-*.exe | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          & $test.FullName live_probe_native_named_command --ignored --nocapture --test-threads=1 2>&1 | Tee-Object store-native-command-probe.log
          if ($LASTEXITCODE -ne 0) { throw 'Named-command native input/control diagnostic failed.' }
      - name: Probe exact worker current-window query before command injection
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        run: |
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'bowser-store-native-worker-query-localappdata'
          New-Item -ItemType Directory -Force $env:LOCALAPPDATA | Out-Null
          $test = Get-ChildItem target/debug/deps/bowser-*.exe | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          & $test.FullName live_probe_native_worker_current_query --ignored --nocapture --test-threads=1 2>&1 | Tee-Object store-native-worker-query-probe.log
          if ($LASTEXITCODE -ne 0) { throw 'Exact pre-injection worker query/control diagnostic failed.' }
      - name: Probe genuine reserved action without popup or host emulation
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        run: |
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'bowser-store-native-action-localappdata'
          New-Item -ItemType Directory -Force $env:LOCALAPPDATA | Out-Null
          $test = Get-ChildItem target/debug/deps/bowser-*.exe | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          & $test.FullName live_probe_native_reserved_action --ignored --nocapture --test-threads=1 2>&1 | Tee-Object store-native-action-keyboard-probe.log
          if ($LASTEXITCODE -ne 0) { throw 'Reserved native action keyboard/control diagnostic failed.' }
      - name: Probe local fixture restart, worker messaging, and hosted-context boundaries
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        run: |
          $env:BOWSER_EXTENSION_TRACE = '1'
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'bowser-store-isolated-localappdata'
          New-Item -ItemType Directory -Force $env:LOCALAPPDATA | Out-Null
          $test = Get-ChildItem target/debug/deps/bowser-*.exe | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          & $test.FullName live_probe_mv3_extension_executes --ignored --nocapture --test-threads=1 2>&1 | Tee-Object store-fixture-probe.log
          if ($LASTEXITCODE -ne 0) { throw 'MV3 lifecycle fixture probe failed.' }
      - name: Probe real pending native callbacks against a second process
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        run: |
          $env:BOWSER_EXTENSION_TRACE = '1'
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'bowser-store-isolated-localappdata'
          $test = Get-ChildItem target/debug/deps/bowser-*.exe | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          & $test.FullName live_probe_pending_native_operations --ignored --nocapture --test-threads=1 2>&1 | Tee-Object store-pending-native-probe.log
          if ($LASTEXITCODE -ne 0) { throw 'Real pending native operation diagnostic failed.' }
      - name: Probe completed native revocations across new processes
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        run: |
          $env:BOWSER_EXTENSION_TRACE = '1'
          $test = Get-ChildItem target/debug/deps/bowser-*.exe | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          & $test.FullName live_probe_completed_revocations_restart --ignored --nocapture --test-threads=1 2>&1 | Tee-Object store-completed-restart-probe.log
          if ($LASTEXITCODE -ne 0) { throw 'Completed native revocation restart diagnostic failed.' }
      - name: Probe stale native owner versus a new signing-identity owner without tracing
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        run: |
          Remove-Item Env:BOWSER_EXTENSION_TRACE -ErrorAction SilentlyContinue
          $test = Get-ChildItem target/debug/deps/bowser-*.exe | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          & $test.FullName live_probe_stale_owner_replacement --ignored --nocapture --test-threads=1 2>&1 | Tee-Object store-stale-owner-probe.log
          if ($LASTEXITCODE -ne 0) { throw 'Stale native owner replacement diagnostic failed.' }
      - name: Probe fail-closed damaged authority at the actual environment boundary
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        run: |
          $env:BOWSER_EXTENSION_TRACE = '1'
          $test = Get-ChildItem target/debug/deps/bowser-*.exe | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          & $test.FullName live_probe_fail_closed_environment --ignored --nocapture --test-threads=1 2>&1 | Tee-Object store-fail-closed-environment-probe.log
          if ($LASTEXITCODE -ne 0) { throw 'Actual fail-closed environment diagnostic failed.' }
      - name: Probe actual profile and private-first extension isolation
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        run: |
          $env:BOWSER_EXTENSION_TRACE = '1'
          $test = Get-ChildItem target/debug/deps/bowser-*.exe | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          & $test.FullName live_probe_profile_private_isolation --ignored --nocapture --test-threads=1 2>&1 | Tee-Object store-profile-private-isolation-probe.log
          if ($LASTEXITCODE -ne 0) { throw 'Actual profile/private isolation diagnostic failed.' }
      - name: Probe signed-keyed process-crash recovery at exact native boundaries
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        run: |
          $env:BOWSER_EXTENSION_TRACE = '1'
          $test = Get-ChildItem target/debug/deps/bowser-*.exe | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          & $test.FullName live_probe_native_crash_recovery --ignored --nocapture --test-threads=1 2>&1 | Tee-Object store-crash-recovery-probe.log
          if ($LASTEXITCODE -ne 0) { throw 'Native process-crash recovery diagnostic failed.' }
      - name: Probe same-identity immutable replacement and rollback feasibility
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        run: |
          $env:BOWSER_EXTENSION_TRACE = '1'
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'bowser-store-isolated-localappdata'
          New-Item -ItemType Directory -Force $env:LOCALAPPDATA | Out-Null
          $test = Get-ChildItem target/debug/deps/bowser-*.exe | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          & $test.FullName live_probe_same_identity_update_and_rollback --ignored --nocapture --test-threads=1 2>&1 | Tee-Object store-update-probe.log
          if ($LASTEXITCODE -ne 0) { throw 'Update/storage/rollback feasibility probe failed.' }
      - name: Probe genuine privileged Settings UI profile isolation
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        run: |
          $env:BOWSER_EXTENSION_TRACE = '1'
          $test = Get-ChildItem target/debug/deps/bowser-*.exe | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          & $test.FullName live_probe_ui_profile_isolation --ignored --nocapture --test-threads=1 2>&1 | Tee-Object store-ui-profile-isolation-probe.log
          if ($LASTEXITCODE -ne 0) { throw 'Actual Settings UI profile isolation diagnostic failed.' }
      - name: Save independent native safety gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: store-native-safety-diagnostics-${{ github.sha }}
          path: |
            store-signed-original-probe.log
            store-record-temp-probe.log
            store-update-model-probe.log
            store-content-script-review.log
            store-document-gate-unit.log
            store-document-gate-native.log
            store-page-links-controls.log
            store-page-links-runtime-controls.log
            store-native-command-probe.log
            store-native-worker-query-probe.log
            store-native-action-keyboard-probe.log
            ${{ runner.temp }}/bowser-native-page-links-*/*.png
            ${{ runner.temp }}/bowser-native-page-links-*/*.json
            store-pending-native-probe.log
            store-completed-restart-probe.log
            store-stale-owner-probe.log
            store-fail-closed-environment-probe.log
            store-profile-private-isolation-probe.log
            store-ui-profile-isolation-probe.log
            store-crash-recovery-probe.log
            store-update-probe.log
          if-no-files-found: warn
          retention-days: 14
  native-store-journey:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve fingerprinted source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Parse native lifecycle scripts
        run: |
          [void][scriptblock]::Create((Get-Content benchmarks/scripts/probe-native-store.ps1 -Raw))
          [void][scriptblock]::Create((Get-Content benchmarks/scripts/probe-native-extension-link.ps1 -Raw))
          [void][scriptblock]::Create((Get-Content benchmarks/scripts/probe-native-extension-command.ps1 -Raw))
          [void][scriptblock]::Create((Get-Content benchmarks/scripts/measure-native-extensions.ps1 -Raw))
      - name: Install official Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Build exact native HTML-default debug executable
        run: |
          cargo +stable build --locked --bin bowser --features html-chrome-default
          if ($LASTEXITCODE -ne 0) { throw 'Native Store debug build failed.' }
      - name: Exercise actual native Store consent lifecycle through Windows accessibility
        run: ./benchmarks/scripts/probe-native-store.ps1 -InstallJourney
      - name: Save native-only evidence, never downloaded packages or profile data
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: store-native-journey-${{ github.sha }}
          path: ${{ runner.temp }}/bowser-native-store/
          if-no-files-found: warn
          retention-days: 14
