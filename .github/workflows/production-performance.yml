name: Production performance comparison
on:
  push:
    branches: ['performance/post-ui']
  pull_request:
    paths:
      - '.github/workflows/production-performance.yml'
      - 'benchmarks/production-*'
      - 'benchmarks/test-production-*'
      - 'benchmarks/*native-detail*'
      - 'benchmarks/*sidebar*'
      - 'src/engine/web_app.rs'
      - 'src/win32/panel_webapp.rs'
      - 'benchmarks/scripts/production-*'
      - 'src/performance.rs'
      - 'src/engine/webview2.rs'
      - 'src/engine/mod.rs'
      - 'src/app.rs'
      - 'src/main.rs'
      - 'src/chrome_host/assets.rs'
      - 'src/blocker.rs'
      - 'src/blocker/registration.rs'
      - 'benchmarks/scripts/filter-parity-fixture.mjs'
      - 'src/chrome_host/host.rs'
      - 'src/win32/window.rs'
      - 'ui/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: production-baseline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  baseline:
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      INTERACTION_DIAGNOSTIC_ONLY: 'true'
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve fingerprinted bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          path: candidate
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact event checkout and unchanged product inputs
        working-directory: candidate
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if((git rev-parse HEAD).Trim() -cne $env:EVENT_SOURCE){throw 'Unexpected merge/source checkout'}
          git fetch --no-tags --depth=1 origin f285525d205b9b388ebb26481f5af01d4df99ac8
          if($LASTEXITCODE -ne 0){throw 'Cannot fetch reviewed product source'}
          $changes=@(git diff --name-only f285525d205b9b388ebb26481f5af01d4df99ac8 HEAD)
          if($LASTEXITCODE -ne 0){throw 'Cannot verify bounded interaction instrumentation'}
          if(@($changes | Where-Object {$_ -cnotin @('.github/workflows/production-performance.yml','benchmarks/production-baseline.ps1','benchmarks/production-analyze.py','benchmarks/interaction-diagnostic.md','benchmarks/production-focus.psm1','benchmarks/test-production-focus.ps1','benchmarks/native-focus-diagnostic.md','benchmarks/controller-focus-diagnostic.md','benchmarks/focus-topology-diagnostic.md','benchmarks/sidebar-lifecycle.psm1','benchmarks/test-sidebar-lifecycle.ps1','benchmarks/sidebar-lifecycle-diagnostic.md','benchmarks/sidebar-analyze.py','benchmarks/test-sidebar-analyze.py','src/engine/web_app.rs','src/win32/panel_webapp.rs','src/performance.rs','src/main.rs','src/app.rs','src/chrome_host/host.rs','src/engine/mod.rs','src/engine/webview2.rs','src/chrome_host/protocol.rs','src/win32/window.rs','src/win32/settings_page.rs','ui/src/interaction-diagnostic.ts','ui/src/main.ts','ui/src/protocol.ts','ui/test/interaction-diagnostic.mjs','ui/package.json','ui/dist.manifest','ui/dist/app.js','ui/dist/settings-page.js','ui/dist/history-page.js')}).Count){throw 'Unexpected changes outside fixed interaction diagnostic slice'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Parse measurement scripts and run contract tests
        working-directory: candidate
        run: |
          foreach ($path in @('benchmarks/production-baseline.ps1','benchmarks/production-measurements.psm1','benchmarks/test-production-measurements.ps1','benchmarks/production-focus.psm1','benchmarks/test-production-focus.ps1','benchmarks/sidebar-lifecycle.psm1','benchmarks/test-sidebar-lifecycle.ps1')) {
            $tokens=$null; $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $pwd $path),[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count) { $errors | Format-List; throw "$path does not parse" }
          }
          ./benchmarks/test-production-measurements.ps1
          ./benchmarks/test-production-focus.ps1
          ./benchmarks/test-sidebar-lifecycle.ps1
          python benchmarks/test-sidebar-analyze.py
          if($LASTEXITCODE -ne 0){throw 'Sidebar analyzer contracts failed'}
          ./benchmarks/test-measurements.ps1
          python benchmarks/test-native-detail-analyze.py
          if ($LASTEXITCODE -ne 0) { throw 'Native detail analyzer contracts failed' }
          python benchmarks/test-production-analyze.py
          if ($LASTEXITCODE -ne 0) { throw 'Analysis contract tests failed' }
          node --check benchmarks/scripts/production-fixture-server.mjs
          node --check benchmarks/scripts/filter-parity-fixture.mjs
      - name: Verify immutable current-with-minimizer c6f93 input before diagnostic-only rebuild
        working-directory: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $source='c6f93eac8d9003e91ba60ac0804bbed29acd14ad'
          git fetch --no-tags --depth=1 origin $source
          if($LASTEXITCODE -ne 0){throw 'Cannot fetch frozen controller source'}
          $harnessBase='73fc3c5881f33936ab6c2ac83eda5e499ef0eaa7'
          git fetch --no-tags --depth=1 origin $harnessBase
          if($LASTEXITCODE -ne 0){throw 'Cannot fetch reviewed predecessor harness'}
          $changes=@(git diff --name-only $harnessBase HEAD)
          if($LASTEXITCODE -ne 0 -or @($changes|Where-Object {$_ -cnotin @('.github/workflows/production-performance.yml','benchmarks/production-baseline.ps1','benchmarks/sidebar-lifecycle.psm1','benchmarks/test-sidebar-lifecycle.ps1','benchmarks/sidebar-lifecycle-diagnostic.md','benchmarks/sidebar-analyze.py','benchmarks/test-sidebar-analyze.py','src/app.rs','src/main.rs','src/performance.rs','src/engine/web_app.rs','src/win32/panel_webapp.rs')}).Count){throw 'Unexpected changes outside measurement-only sidebar slice'}
          $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          $zip=Join-Path $env:RUNNER_TEMP 'controller-c6f93.zip'
          Invoke-WebRequest -Headers $headers -Uri 'https://api.github.com/repos/grantcharlie1000-tech/Bowser/actions/artifacts/12136361999/zip' -OutFile $zip
          $archiveHash=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if($archiveHash -cne '8ed7287f9fcdb71087fd61ee9bc256ea06bb4345c14beb37e5c3dce7864bdcfe'){throw 'Frozen controller archive digest mismatch'}
          $cache=Join-Path $env:RUNNER_TEMP 'controller-c6f93'
          Expand-Archive -LiteralPath $zip -DestinationPath $cache
          New-Item -ItemType Directory -Force ../evidence | Out-Null
          # Copy immutable executables/provenance only, never prior rows, profiles or isolation markers.
          foreach($folder in @('candidate','interaction-reference','frozen','reference')){Copy-Item (Join-Path $cache $folder) ../evidence/ -Recurse}
          Copy-Item (Join-Path $cache 'input-manifest.json') ../evidence/input-manifest.json
          $candidate=Get-Content ../evidence/candidate/identity.json -Raw | ConvertFrom-Json
          $reference=Get-Content ../evidence/interaction-reference/identity.json -Raw | ConvertFrom-Json
          if($candidate.source -cne $source -or $candidate.tree -cne '6fd425195b5ccf65214584552de1e2322f64f731' -or $candidate.sha256 -cne '40c68ab5ad01cfa30b1632f58047e5293b2d7c0f305c05e9be51b4d8a3aff905' -or $candidate.bytes -ne 7883264){throw 'Frozen matched candidate identity mismatch'}
          if($reference.source -cne 'tree:50708b8a05cd6f203503b1a83c6bee4f3dad4fc4' -or $reference.instrumentation_source -cne $source -or $reference.sha256 -cne 'ba569e18a2b6bf220805aad6de67ce3adc03d94ce48cbffd01ec2ca65b83147a' -or $reference.bytes -ne 7851008){throw 'Frozen matched reference identity mismatch'}
          $expected=[ordered]@{baseline='d0075f2807fd94000cb51ace647eaf335c71ab37c8302a91f0a52d3380dbe0fa';diagnostic='ba569e18a2b6bf220805aad6de67ce3adc03d94ce48cbffd01ec2ca65b83147a';release='341486070d2e74cf9a9e5d5fbeffa90c7dd2ec4fd36bc284a8a3878a7a9bcec1';candidate='40c68ab5ad01cfa30b1632f58047e5293b2d7c0f305c05e9be51b4d8a3aff905'}
          $manifest=Get-Content ../evidence/input-manifest.json -Raw | ConvertFrom-Json
          $paths=@{baseline='../evidence/frozen/untouched-main.exe';diagnostic='../evidence/interaction-reference/reference.exe';release='../evidence/frozen/released-v0.0.19.exe';candidate='../evidence/candidate/candidate.exe'}
          foreach($role in $expected.Keys){if($manifest.$role -cne $expected[$role] -or (Get-FileHash $paths[$role] -Algorithm SHA256).Hash.ToLowerInvariant() -cne $expected[$role]){throw "Frozen topology input mismatch: $role"}}
          if((Get-Item $paths.candidate).Length -ne 7883264 -or (Get-Item $paths.diagnostic).Length -ne 7851008){throw 'Frozen matched input size mismatch'}
          git diff --exit-code $source HEAD -- src/blocker.rs src/blocker/registration.rs src/chrome_host/assets.rs ui
          if($LASTEXITCODE -ne 0){throw 'Minimizer/security/UI bytes must remain unchanged for sidebar baseline'}
          New-Item -ItemType Directory -Force ../evidence/sidebar-reference | Out-Null
          Copy-Item ../evidence/candidate/candidate.exe ../evidence/sidebar-reference/reference.exe
          Copy-Item ../evidence/candidate/identity.json ../evidence/sidebar-reference/identity.json
          [ordered]@{artifact_id=12136361999;archive_sha256=$archiveHash;source=$source;scope='Current WITH-minimizer reference retained; archived minus-minimizer interaction reference is NOT used in this sidebar experiment'} | ConvertTo-Json | Set-Content ../evidence/sidebar-frozen-provenance.json
      - name: Reuse verified 8036 sidebar executable after harness-only setup correction
        working-directory: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $source='8036b86d109e6aec7a39808589655a43ee34b85d'
          git fetch --no-tags --depth=1 origin $source
          if($LASTEXITCODE -ne 0){throw 'Cannot fetch frozen sidebar build source'}
          $changes=@(git diff --name-only $source HEAD)
          if($LASTEXITCODE -ne 0 -or @($changes|Where-Object {$_ -cnotin @('.github/workflows/production-performance.yml','benchmarks/production-baseline.ps1','benchmarks/sidebar-lifecycle.psm1','benchmarks/test-sidebar-lifecycle.ps1','benchmarks/sidebar-lifecycle-diagnostic.md')}).Count){throw 'Frozen sidebar EXE reuse allows only the reviewed harness correction'}
          git diff --exit-code $source HEAD -- src ui Cargo.toml Cargo.lock build.rs
          if($LASTEXITCODE -ne 0){throw 'Frozen sidebar runtime/build inputs changed'}
          $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          $zip=Join-Path $env:RUNNER_TEMP 'sidebar-8036.zip'
          Invoke-WebRequest -Headers $headers -Uri 'https://api.github.com/repos/grantcharlie1000-tech/Bowser/actions/artifacts/12137628254/zip' -OutFile $zip
          $archiveHash=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if($archiveHash -cne 'c5fd895e5b4b12768736363e43b1295a4ad1f23b65284ac087cb06c64e6b668e'){throw 'Frozen sidebar archive digest mismatch'}
          $cache=Join-Path $env:RUNNER_TEMP 'sidebar-8036'
          Expand-Archive -LiteralPath $zip -DestinationPath $cache
          $identity=Get-Content (Join-Path $cache 'candidate/identity.json') -Raw | ConvertFrom-Json
          $exe=Join-Path $cache 'candidate/candidate.exe'
          if($identity.source -cne $source -or $identity.tree -cne '2a36d4c7af8ee00c27f950151f3ace8152fb72ed' -or $identity.sha256 -cne 'e42a1005193c54b08fba8c6f65f88757900f6bc400d4c350b0b386453406fa66' -or $identity.bytes -ne 7889408 -or (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant() -cne $identity.sha256 -or (Get-Item $exe).Length -ne $identity.bytes){throw 'Frozen sidebar executable identity mismatch'}
          Copy-Item (Join-Path $cache 'candidate/*') ../evidence/candidate/ -Force
          # Preserve original candidate identity; HEAD identifies only the corrected harness.
          Copy-Item (Join-Path $cache 'input-manifest.json') ../evidence/input-manifest.json -Force
          [ordered]@{harness_source=(git rev-parse HEAD).Trim();candidate_source=$source;candidate_tree=$identity.tree;candidate_sha256=$identity.sha256;artifact_id=12137628254;archive_sha256=$archiveHash;rebuild=$false;baseline_kind='Measurement-only current-minimizer line';same_exe_logging_on_off=$true;settled_pairs=3;rapid_pairs=1;planned_rows=16;previous_run='39132170003: 16 invalid setup rows preserved; missing ordinary Apps visibility and immediate foreground guard; zero webapp observations';stop='Fixed cohort, retain every failure; no retries/repair; identity/isolation failure blocks later lanes';scope='First B-open and retained resource/count baseline, not an optimization comparison or input correctness result'} | ConvertTo-Json | Set-Content ../evidence/sidebar-provenance.json
      - name: Bounded native actual-module and HTML activation validity pass
        id: validity
        working-directory: candidate
        run: |
          $control=@{};if($env:INTERACTION_DIAGNOSTIC_ONLY -eq 'true'){$control=@{DiagnosticAutoUpdateOff=$true;ExpectedInputManifest='../evidence/input-manifest.json'}}
          ./benchmarks/production-baseline.ps1 -BaselineExe ../evidence/frozen/untouched-main.exe -DiagnosticExe ../evidence/sidebar-reference/reference.exe -DiagnosticSource (Get-Content ../evidence/sidebar-reference/identity.json -Raw | ConvertFrom-Json).source -ReleaseExe ../evidence/frozen/released-v0.0.19.exe -CandidateExe ../evidence/candidate/candidate.exe -CandidateSource (Get-Content ../evidence/candidate/identity.json -Raw | ConvertFrom-Json).source -Out ../evidence/validity @control -StartupOnly -Pairs 1 -Fixtures light -IdleSeconds 1 -MeasurementMode timing -MaxInvalidSamples 1
      - name: Fixed settled sidebar logging ON OFF lifecycle and resource baseline
        if: ${{ !cancelled() && steps.validity.outcome == 'success' }}
        working-directory: candidate
        run: |
          ./benchmarks/production-baseline.ps1 -BaselineExe ../evidence/frozen/untouched-main.exe -DiagnosticExe ../evidence/sidebar-reference/reference.exe -DiagnosticSource (Get-Content ../evidence/sidebar-reference/identity.json -Raw | ConvertFrom-Json).source -ReleaseExe ../evidence/frozen/released-v0.0.19.exe -CandidateExe ../evidence/candidate/candidate.exe -CandidateSource (Get-Content ../evidence/candidate/identity.json -Raw | ConvertFrom-Json).source -DiagnosticAutoUpdateOff -ExpectedInputManifest ../evidence/input-manifest.json -SidebarLifecyclePilot -StartupOnly -PositiveOnly -Fixtures light -MeasurementMode timing -MaxInvalidSamples 20 -SidebarScenario settled -Pairs 3 -Out ../evidence/sidebar-settled
      - name: Fixed rapid sidebar logging ON OFF lifecycle and resource baseline
        if: ${{ !cancelled() && steps.validity.outcome == 'success' }}
        working-directory: candidate
        run: |
          ./benchmarks/production-baseline.ps1 -BaselineExe ../evidence/frozen/untouched-main.exe -DiagnosticExe ../evidence/sidebar-reference/reference.exe -DiagnosticSource (Get-Content ../evidence/sidebar-reference/identity.json -Raw | ConvertFrom-Json).source -ReleaseExe ../evidence/frozen/released-v0.0.19.exe -CandidateExe ../evidence/candidate/candidate.exe -CandidateSource (Get-Content ../evidence/candidate/identity.json -Raw | ConvertFrom-Json).source -DiagnosticAutoUpdateOff -ExpectedInputManifest ../evidence/input-manifest.json -SidebarLifecyclePilot -StartupOnly -PositiveOnly -Fixtures light -MeasurementMode timing -MaxInvalidSamples 20 -SidebarScenario rapid -Pairs 1 -Out ../evidence/sidebar-rapid
      - name: Derive descriptive paired statistics without accepting gains automatically
        if: always()
        working-directory: candidate
        run: |
          foreach($arm in @('validity','sidebar-settled','sidebar-rapid')) {
            $folder="../evidence/$arm"
            if(Test-Path "$folder/environment.json") {
              python benchmarks/production-analyze.py $folder
              if($LASTEXITCODE -ne 0){throw "Analysis failed for $arm; raw samples remain preserved"}
              if($arm -like 'sidebar-*'){python benchmarks/sidebar-analyze.py $folder;if($LASTEXITCODE -ne 0){throw "Sidebar analysis failed for $arm"}}
            }
          }
      - name: Preserve raw samples and frozen executables, not disposable renderer caches
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-performance-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            evidence/frozen/
            evidence/sidebar-reference/
            evidence/candidate/
            evidence/input-manifest.json
            evidence/sidebar-*.json
            evidence/native-isolation-blocked.json
            evidence/surface-module-smoke.json
            evidence/validity/*.json
            evidence/validity/*.csv
            evidence/validity/*stderr.txt
            evidence/validity/*.png
            evidence/validity/isolated/requests.jsonl
            evidence/sidebar-settled/*.json
            evidence/sidebar-settled/*.csv
            evidence/sidebar-settled/*.png
            evidence/sidebar-settled/*stderr.txt
            evidence/sidebar-settled/isolated/requests.jsonl
            evidence/sidebar-rapid/*.json
            evidence/sidebar-rapid/*.csv
            evidence/sidebar-rapid/*.png
            evidence/sidebar-rapid/*stderr.txt
            evidence/sidebar-rapid/isolated/requests.jsonl
          if-no-files-found: warn
          retention-days: 30
