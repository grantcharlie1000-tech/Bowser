name: Production performance comparison
on:
  push:
    branches: ['performance/post-ui']
  pull_request:
    paths:
      - '.github/workflows/production-performance.yml'
      - 'benchmarks/production-*'
      - 'benchmarks/test-production-*'
      - 'benchmarks/*native-detail*'
      - 'benchmarks/scripts/production-*'
      - 'src/performance.rs'
      - 'src/engine/webview2.rs'
      - 'src/engine/mod.rs'
      - 'src/app.rs'
      - 'src/main.rs'
      - 'src/chrome_host/assets.rs'
      - 'src/blocker.rs'
      - 'src/blocker/registration.rs'
      - 'benchmarks/scripts/filter-parity-fixture.mjs'
      - 'src/chrome_host/host.rs'
      - 'src/win32/window.rs'
      - 'ui/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: production-baseline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  baseline:
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      INTERACTION_DIAGNOSTIC_ONLY: 'true'
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve fingerprinted bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          path: candidate
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact event checkout and unchanged product inputs
        working-directory: candidate
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if((git rev-parse HEAD).Trim() -cne $env:EVENT_SOURCE){throw 'Unexpected merge/source checkout'}
          git fetch --no-tags --depth=1 origin f285525d205b9b388ebb26481f5af01d4df99ac8
          if($LASTEXITCODE -ne 0){throw 'Cannot fetch reviewed product source'}
          $changes=@(git diff --name-only f285525d205b9b388ebb26481f5af01d4df99ac8 HEAD)
          if($LASTEXITCODE -ne 0){throw 'Cannot verify workflow-only follow-up'}
          if(@($changes | Where-Object {$_ -cnotin @('.github/workflows/production-performance.yml','benchmarks/production-baseline.ps1')}).Count){throw 'Product inputs differ from reviewed filter candidate'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Parse measurement scripts and run contract tests
        working-directory: candidate
        run: |
          foreach ($path in @('benchmarks/production-baseline.ps1','benchmarks/production-measurements.psm1','benchmarks/test-production-measurements.ps1')) {
            $tokens=$null; $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $pwd $path),[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count) { $errors | Format-List; throw "$path does not parse" }
          }
          ./benchmarks/test-production-measurements.ps1
          ./benchmarks/test-measurements.ps1
          python benchmarks/test-native-detail-analyze.py
          if ($LASTEXITCODE -ne 0) { throw 'Native detail analyzer contracts failed' }
          python benchmarks/test-production-analyze.py
          if ($LASTEXITCODE -ne 0) { throw 'Analysis contract tests failed' }
          node --check benchmarks/scripts/production-fixture-server.mjs
          node --check benchmarks/scripts/filter-parity-fixture.mjs
      - name: Reuse and verify immutable binaries already built from the exact frozen sources
        working-directory: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The two baseline binaries remain frozen; the candidate is built separately below.
          git fetch --no-tags --depth=1 origin 8a60dca2ac7de6d369c9b65584fd621a7013f491
          if ($LASTEXITCODE -ne 0) { throw 'Cannot fetch immutable diagnostic source' }
          git fetch --no-tags --depth=1 origin 80eabd7ae6d421e61c81985c34023bfc824a2e58
          if ($LASTEXITCODE -ne 0) { throw 'Cannot fetch untouched source for instrumentation provenance' }
          git fetch --no-tags --depth=1 origin 46ee3b3ef98a4c7603967d22df9cb1490ca936c1
          if($LASTEXITCODE -ne 0){throw 'Cannot fetch immediate pre-optimization reference'}
          # Only the proved registration-union minimizer differs from the immediate reference.
          $allowedNative=@('src/blocker.rs','src/blocker/registration.rs')
          $nativeChanges=@(git diff --name-only 46ee3b3ef98a4c7603967d22df9cb1490ca936c1 HEAD -- src)
          if($LASTEXITCODE -ne 0){throw 'Cannot verify diagnostic native source provenance'}
          $unexpectedNative=@($nativeChanges | Where-Object {$_ -cnotin $allowedNative})
          if($unexpectedNative.Count){throw "Unexpected native changes outside diagnostic slice: $unexpectedNative"}
          New-Item -ItemType Directory -Force ../evidence/candidate | Out-Null
          git diff 46ee3b3ef98a4c7603967d22df9cb1490ca936c1 HEAD -- src | Set-Content ../evidence/candidate/native-filter.patch
          if($LASTEXITCODE -ne 0){throw 'Cannot preserve diagnostic source patch'}
          [ordered]@{frozen_source='46ee3b3ef98a4c7603967d22df9cb1490ca936c1';candidate_source=if($env:INTERACTION_DIAGNOSTIC_ONLY -eq 'true'){'94e9ec423f411b5ba177112978415d0dd552af58'}else{(git rev-parse HEAD).Trim()};harness_source=(git rev-parse HEAD).Trim();candidate_rebuilt=($env:INTERACTION_DIAGNOSTIC_ONLY -ne 'true');allowed_native_paths=$allowedNative;actual_native_paths=$nativeChanges;scope='Existing-registration-glob subset with retained covering witnesses; immediate reference immutable; candidate identity/reuse mode explicit'} | ConvertTo-Json | Set-Content ../evidence/candidate/native-detail-provenance.json
          $zip=Join-Path $env:RUNNER_TEMP 'production-frozen-8a60dca.zip'
          $headers=@{ Authorization="Bearer $env:GH_TOKEN"; Accept='application/vnd.github+json'; 'X-GitHub-Api-Version'='2022-11-28' }
          Invoke-WebRequest 'https://api.github.com/repos/grantcharlie1000-tech/Bowser/actions/artifacts/12121088896/zip' -Headers $headers -OutFile $zip
          $archiveHash=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($archiveHash -cne '7067133916748c8726a74bf48a599834f82adadfebf6c0ef1c69f2afd763ccef') { throw 'Frozen binary archive digest mismatch' }
          Expand-Archive -LiteralPath $zip -DestinationPath ../evidence
          $frozen=Join-Path $pwd '../evidence/frozen'
          foreach ($entry in (Get-Content (Join-Path $frozen 'manifest.json') -Raw | ConvertFrom-Json)) {
            $path=Join-Path $frozen $entry.name
            if ((Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant() -cne $entry.sha256) { throw "Frozen input hash mismatch: $($entry.name)" }
            if ((Get-Item $path).Length -ne $entry.bytes) { throw "Frozen input size mismatch: $($entry.name)" }
          }
          git diff 80eabd7ae6d421e61c81985c34023bfc824a2e58 8a60dca2ac7de6d369c9b65584fd621a7013f491 -- src | Set-Content (Join-Path $frozen 'instrumentation.patch')
          if ($LASTEXITCODE -ne 0) { throw 'Cannot preserve instrumentation diff' }
          [ordered]@{archive_artifact_id=12121088896;archive_sha256=$archiveHash;diagnostic_source='8a60dca2ac7de6d369c9b65584fd621a7013f491';untouched_source='80eabd7ae6d421e61c81985c34023bfc824a2e58';harness_source=(git rev-parse HEAD).Trim();previous_source_tests='run39086719160, measurement module tests and Windows source check passed'} | ConvertTo-Json | Set-Content ../evidence/frozen/provenance.json
          # Freeze the actual instrumented pre-optimization EXE, not a rebuilt reference.
          $referenceZip=Join-Path $env:RUNNER_TEMP 'filter-reference-46ee.zip'
          Invoke-WebRequest 'https://api.github.com/repos/grantcharlie1000-tech/Bowser/actions/artifacts/12125524797/zip' -Headers $headers -OutFile $referenceZip
          if((Get-FileHash $referenceZip -Algorithm SHA256).Hash.ToLowerInvariant() -cne '4bfcfc316f6b7fed074d8736308a0e22d7b8ddb6c95e922f0130601b6fadc0e1'){throw 'Immediate reference archive digest mismatch'}
          $referenceCache=Join-Path $env:RUNNER_TEMP 'filter-reference-46ee'
          Expand-Archive -LiteralPath $referenceZip -DestinationPath $referenceCache
          $identity=Get-Content (Join-Path $referenceCache 'candidate/identity.json') -Raw | ConvertFrom-Json
          $reference=Join-Path $referenceCache 'candidate/candidate.exe'
          if($identity.source -cne '46ee3b3ef98a4c7603967d22df9cb1490ca936c1' -or $identity.sha256 -cne '22674e9fdaa589915200b3058765ec202843d87d7ecabdad081911537004bd2b' -or $identity.bytes -ne 7817216 -or (Get-FileHash $reference -Algorithm SHA256).Hash.ToLowerInvariant() -cne $identity.sha256 -or (Get-Item $reference).Length -ne $identity.bytes){throw 'Immediate reference EXE identity mismatch'}
          New-Item -ItemType Directory -Force ../evidence/reference | Out-Null
          Copy-Item $reference ../evidence/reference/reference.exe
          Copy-Item (Join-Path $referenceCache 'candidate/identity.json') ../evidence/reference/identity.json
          [ordered]@{source=$identity.source;artifact_id=12125524797;archive_sha256='4bfcfc316f6b7fed074d8736308a0e22d7b8ddb6c95e922f0130601b6fadc0e1';harness_source=(git rev-parse HEAD).Trim();policy='No rebuild or relabelling of reference bytes'} | ConvertTo-Json | Set-Content ../evidence/reference/provenance.json
      - name: Reuse exact tested filter candidate for isolated input diagnostics
        if: env.INTERACTION_DIAGNOSTIC_ONLY == 'true'
        working-directory: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip=Join-Path $env:RUNNER_TEMP 'filter-tested-94e9.zip'
          $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          Invoke-WebRequest 'https://api.github.com/repos/grantcharlie1000-tech/Bowser/actions/artifacts/12127686230/zip' -Headers $headers -OutFile $zip
          if((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -cne 'df8d3a0141925a89a1f4a830d0ffbbb78556f14361482581cbd602fec73aaf69'){throw 'Tested filter candidate archive mismatch'}
          $cache=Join-Path $env:RUNNER_TEMP 'filter-tested-94e9'
          Expand-Archive -LiteralPath $zip -DestinationPath $cache
          $identity=Get-Content (Join-Path $cache 'candidate/identity.json') -Raw | ConvertFrom-Json
          $file=Join-Path $cache 'candidate/candidate.exe'
          if($identity.source -cne '94e9ec423f411b5ba177112978415d0dd552af58' -or $identity.product_source -cne 'f285525d205b9b388ebb26481f5af01d4df99ac8' -or $identity.sha256 -cne 'a323440fd4b0a9d13d56e77639336a51fff48b1ae0fa032aa377e0e58b891df5' -or (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant() -cne $identity.sha256 -or (Get-Item $file).Length -ne 7849472){throw 'Tested filter candidate EXE mismatch'}
          Copy-Item $file ../evidence/candidate/candidate.exe
          Copy-Item (Join-Path $cache 'candidate/identity.json') ../evidence/candidate/identity.json
          [ordered]@{baseline='d0075f2807fd94000cb51ace647eaf335c71ab37c8302a91f0a52d3380dbe0fa';diagnostic='22674e9fdaa589915200b3058765ec202843d87d7ecabdad081911537004bd2b';release='341486070d2e74cf9a9e5d5fbeffa90c7dd2ec4fd36bc284a8a3878a7a9bcec1';candidate='a323440fd4b0a9d13d56e77639336a51fff48b1ae0fa032aa377e0e58b891df5'} | ConvertTo-Json | Set-Content ../evidence/input-manifest.json
          [ordered]@{candidate_source=$identity.source;product_source=$identity.product_source;harness_source=(git rev-parse HEAD).Trim();artifact_id=12127686230;archive_sha256='df8d3a0141925a89a1f4a830d0ffbbb78556f14361482581cbd602fec73aaf69';scope='Isolated input diagnostic, no product rebuild or primary matrix rerun; original failed surface result remains retained'} | ConvertTo-Json | Set-Content ../evidence/candidate/input-diagnostic-provenance.json
      - name: Build and fingerprint actual filter-union candidate
        if: env.INTERACTION_DIAGNOSTIC_ONLY != 'true'
        working-directory: candidate
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component clippy
          if ($LASTEXITCODE -ne 0) { throw 'Pinned toolchain installation failed' }
          Push-Location ui
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Locked UI install failed' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'UI rebuild failed' }
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { throw 'UI typecheck failed' }
          npm run lint
          if ($LASTEXITCODE -ne 0) { throw 'UI lint failed' }
          $env:BOWSER_TEST_EDGE='C:/Program Files (x86)/Microsoft/Edge/Application/msedge.exe'
          if (-not (Test-Path $env:BOWSER_TEST_EDGE)) { $env:BOWSER_TEST_EDGE='C:/Program Files/Microsoft/Edge/Application/msedge.exe' }
          if (-not (Test-Path $env:BOWSER_TEST_EDGE)) { throw 'Edge required for actual all-surface module/CSP smoke' }
          # Compare actual browser module first-use costs with the exact frozen baseline assets.
          New-Item -ItemType Directory -Force ../../evidence/baseline-ui | Out-Null
          $archive=Join-Path $env:RUNNER_TEMP 'baseline-ui.tar'
          git -C .. archive --format=tar --output=$archive 46ee3b3ef98a4c7603967d22df9cb1490ca936c1 ui/dist
          if ($LASTEXITCODE -ne 0) { throw 'Cannot archive frozen baseline UI bytes' }
          tar -xf $archive -C ../../evidence/baseline-ui
          if ($LASTEXITCODE -ne 0) { throw 'Cannot extract frozen baseline UI bytes' }
          $env:BOWSER_UI_BASELINE_DIST=(Resolve-Path ../../evidence/baseline-ui/ui/dist).Path
          $env:BOWSER_UI_SURFACE_REPORT=Join-Path (Resolve-Path ../../evidence).Path 'surface-module-regressions.json'
          node --test test/hardening.mjs test/surface-modules.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Actual module/CSP smoke failed' }
          Pop-Location
          git diff --exit-code -- ui/src/icons.gen.ts ui/dist ui/dist.manifest
          if ($LASTEXITCODE -ne 0) { throw 'Committed assets are not reproducible' }
          cargo +1.99.1 test --locked
          if ($LASTEXITCODE -ne 0) { throw 'Default Rust contracts failed' }
          cargo +1.99.1 test --locked --features html-chrome-default
          if ($LASTEXITCODE -ne 0) { throw 'HTML Rust contracts failed' }
          cargo +1.99.1 clippy --locked --features html-chrome-default -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Clippy failed' }
          cargo +1.99.1 build --release --locked --bin bowser --features html-chrome-default
          if ($LASTEXITCODE -ne 0) { throw 'Actual candidate build failed' }
          New-Item -ItemType Directory -Force ../evidence/candidate | Out-Null
          Copy-Item target/release/bowser.exe ../evidence/candidate/candidate.exe
          Copy-Item Cargo.lock,ui/dist.manifest ../evidence/candidate/
          $file=Get-Item ../evidence/candidate/candidate.exe
          [ordered]@{product_source='f285525d205b9b388ebb26481f5af01d4df99ac8';source=(git rev-parse HEAD).Trim();tree=(git rev-parse 'HEAD^{tree}').Trim();sha256=(Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant();bytes=$file.Length;toolchain=(rustc +1.99.1 --version --verbose | Out-String);features='html-chrome-default';scope='proved existing registration-glob redundancy elimination; not a release'} | ConvertTo-Json | Set-Content ../evidence/candidate/identity.json
      - name: Bounded native actual-module and HTML activation validity pass
        id: validity
        working-directory: candidate
        run: |
          $control=@{};if($env:INTERACTION_DIAGNOSTIC_ONLY -eq 'true'){$control=@{DiagnosticAutoUpdateOff=$true;ExpectedInputManifest='../evidence/input-manifest.json'}}
          ./benchmarks/production-baseline.ps1 -BaselineExe ../evidence/frozen/untouched-main.exe -DiagnosticExe ../evidence/reference/reference.exe -DiagnosticSource 46ee3b3ef98a4c7603967d22df9cb1490ca936c1 -ReleaseExe ../evidence/frozen/released-v0.0.19.exe -CandidateExe ../evidence/candidate/candidate.exe -CandidateSource (Get-Content ../evidence/candidate/identity.json -Raw | ConvertFrom-Json).source -Out ../evidence/validity @control -StartupOnly -Pairs 1 -Fixtures light -IdleSeconds 1 -MeasurementMode timing -MaxInvalidSamples 1
      - name: Corrected diagnostic-off untouched and logging-on off controls
        if: env.INTERACTION_DIAGNOSTIC_ONLY != 'true'
        working-directory: candidate
        run: |
          ./benchmarks/production-baseline.ps1 -BaselineExe ../evidence/frozen/untouched-main.exe -DiagnosticExe ../evidence/reference/reference.exe -DiagnosticSource 46ee3b3ef98a4c7603967d22df9cb1490ca936c1 -ReleaseExe ../evidence/frozen/released-v0.0.19.exe -Out ../evidence/controls -StartupOnly -Pairs 3 -Fixtures light -MeasurementMode timing -MaxInvalidSamples 1
      - name: Ten matched AB BA pairs fresh and reused primary startup timing
        if: env.INTERACTION_DIAGNOSTIC_ONLY != 'true'
        working-directory: candidate
        run: |
          ./benchmarks/production-baseline.ps1 -BaselineExe ../evidence/frozen/untouched-main.exe -DiagnosticExe ../evidence/reference/reference.exe -DiagnosticSource 46ee3b3ef98a4c7603967d22df9cb1490ca936c1 -ReleaseExe ../evidence/frozen/released-v0.0.19.exe -CandidateExe ../evidence/candidate/candidate.exe -CandidateSource (Get-Content ../evidence/candidate/identity.json -Raw | ConvertFrom-Json).source -Out ../evidence/timing -StartupOnly -Pairs 10 -Fixtures light -MeasurementMode timing -MaxInvalidSamples 1
      - name: Ten matched AB BA pairs fresh and reused primary settled resources
        if: env.INTERACTION_DIAGNOSTIC_ONLY != 'true'
        working-directory: candidate
        run: |
          ./benchmarks/production-baseline.ps1 -BaselineExe ../evidence/frozen/untouched-main.exe -DiagnosticExe ../evidence/reference/reference.exe -DiagnosticSource 46ee3b3ef98a4c7603967d22df9cb1490ca936c1 -ReleaseExe ../evidence/frozen/released-v0.0.19.exe -CandidateExe ../evidence/candidate/candidate.exe -CandidateSource (Get-Content ../evidence/candidate/identity.json -Raw | ConvertFrom-Json).source -Out ../evidence/resource -StartupOnly -Pairs 10 -Fixtures light -MeasurementMode resource -MaxInvalidSamples 1
      - name: Separate small detail arm confirms actual registration count and cost
        if: ${{ !cancelled() && env.INTERACTION_DIAGNOSTIC_ONLY != 'true' && steps.validity.outcome == 'success' }}
        working-directory: candidate
        run: |
          ./benchmarks/production-baseline.ps1 -BaselineExe ../evidence/frozen/untouched-main.exe -DiagnosticExe ../evidence/reference/reference.exe -DiagnosticSource 46ee3b3ef98a4c7603967d22df9cb1490ca936c1 -ReleaseExe ../evidence/frozen/released-v0.0.19.exe -CandidateExe ../evidence/candidate/candidate.exe -CandidateSource (Get-Content ../evidence/candidate/identity.json -Raw | ConvertFrom-Json).source -Out ../evidence/detail -StartupOnly -PositiveOnly -Pairs 2 -DiagnosticDetailPilot -Fixtures light -MeasurementMode timing -MaxInvalidSamples 1
      - name: Mandatory actual native request-dispatch parity including worker sources
        if: ${{ !cancelled() && env.INTERACTION_DIAGNOSTIC_ONLY != 'true' && steps.validity.outcome == 'success' }}
        working-directory: candidate
        run: |
          ./benchmarks/production-baseline.ps1 -BaselineExe ../evidence/frozen/untouched-main.exe -DiagnosticExe ../evidence/reference/reference.exe -DiagnosticSource 46ee3b3ef98a4c7603967d22df9cb1490ca936c1 -ReleaseExe ../evidence/frozen/released-v0.0.19.exe -CandidateExe ../evidence/candidate/candidate.exe -CandidateSource (Get-Content ../evidence/candidate/identity.json -Raw | ConvertFrom-Json).source -Out ../evidence/parity -StartupOnly -PositiveOnly -Pairs 1 -Fixtures filter-parity -MeasurementMode timing -MaxInvalidSamples 1
      - name: Mandatory independent native first-use interaction smoke
        if: ${{ !cancelled() && env.INTERACTION_DIAGNOSTIC_ONLY != 'true' && steps.validity.outcome == 'success' }}
        working-directory: candidate
        run: |
          ./benchmarks/production-baseline.ps1 -BaselineExe ../evidence/frozen/untouched-main.exe -DiagnosticExe ../evidence/reference/reference.exe -DiagnosticSource 46ee3b3ef98a4c7603967d22df9cb1490ca936c1 -ReleaseExe ../evidence/frozen/released-v0.0.19.exe -CandidateExe ../evidence/candidate/candidate.exe -CandidateSource (Get-Content ../evidence/candidate/identity.json -Raw | ConvertFrom-Json).source -IncludeSurfaceSmoke -PositiveOnly -Out ../evidence/surfaces -StartupOnly -Pairs 1 -Fixtures light -MeasurementMode timing -MaxInvalidSamples 1
      - name: Per-key diagnostic minimum30ms plus UIA fixed AB BA attempts
        if: ${{ !cancelled() && env.INTERACTION_DIAGNOSTIC_ONLY == 'true' && steps.validity.outcome == 'success' }}
        working-directory: candidate
        run: |
          ./benchmarks/production-baseline.ps1 -BaselineExe ../evidence/frozen/untouched-main.exe -DiagnosticExe ../evidence/reference/reference.exe -DiagnosticSource 46ee3b3ef98a4c7603967d22df9cb1490ca936c1 -ReleaseExe ../evidence/frozen/released-v0.0.19.exe -CandidateExe ../evidence/candidate/candidate.exe -CandidateSource (Get-Content ../evidence/candidate/identity.json -Raw | ConvertFrom-Json).source -IncludeSurfaceSmoke -SurfaceInputMethod sendkeys-per-key -DiagnosticAutoUpdateOff -ExpectedInputManifest ../evidence/input-manifest.json -PositiveOnly -Out ../evidence/keyboard-per-key -StartupOnly -Pairs 3 -Fixtures light -MeasurementMode timing -MaxInvalidSamples 20
      - name: Isolated input diagnostic uia-value fixed AB BA attempts
        if: ${{ !cancelled() && env.INTERACTION_DIAGNOSTIC_ONLY == 'true' && steps.validity.outcome == 'success' }}
        working-directory: candidate
        run: |
          ./benchmarks/production-baseline.ps1 -BaselineExe ../evidence/frozen/untouched-main.exe -DiagnosticExe ../evidence/reference/reference.exe -DiagnosticSource 46ee3b3ef98a4c7603967d22df9cb1490ca936c1 -ReleaseExe ../evidence/frozen/released-v0.0.19.exe -CandidateExe ../evidence/candidate/candidate.exe -CandidateSource (Get-Content ../evidence/candidate/identity.json -Raw | ConvertFrom-Json).source -IncludeSurfaceSmoke -SurfaceInputMethod uia-value -DiagnosticAutoUpdateOff -ExpectedInputManifest ../evidence/input-manifest.json -PositiveOnly -Out ../evidence/navigation-value-control -StartupOnly -Pairs 1 -Fixtures light -MeasurementMode timing -MaxInvalidSamples 20
      - name: Derive descriptive paired statistics without accepting gains automatically
        if: always()
        working-directory: candidate
        run: |
          foreach($arm in @('validity','controls','timing','resource','detail','parity','surfaces','keyboard-legacy','keyboard-per-key','navigation-value-control')) {
            $folder="../evidence/$arm"
            if(Test-Path "$folder/environment.json") {
              python benchmarks/production-analyze.py $folder
              if($LASTEXITCODE -ne 0){throw "Analysis failed for $arm; raw samples remain preserved"}
              python benchmarks/native-detail-analyze.py $folder
              if($LASTEXITCODE -ne 0){throw "Native attribution analysis failed for $arm; raw samples remain preserved"}
            }
          }
      - name: Preserve raw samples and frozen executables, not disposable renderer caches
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-performance-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            evidence/frozen/
            evidence/input-manifest.json
            evidence/native-isolation-blocked.json
            evidence/candidate/
            evidence/reference/
            evidence/baseline-ui/
            evidence/surface-module-regressions.json
            evidence/validity/*.json
            evidence/validity/*.csv
            evidence/validity/*stderr.txt
            evidence/validity/*.png
            evidence/validity/isolated/requests.jsonl
            evidence/controls/*.json
            evidence/controls/*.csv
            evidence/controls/*stderr.txt
            evidence/controls/*.png
            evidence/controls/isolated/requests.jsonl
            evidence/timing/*.json
            evidence/timing/*.csv
            evidence/timing/*stderr.txt
            evidence/timing/*.png
            evidence/timing/isolated/requests.jsonl
            evidence/resource/*.json
            evidence/resource/*.csv
            evidence/resource/*stderr.txt
            evidence/resource/*.png
            evidence/resource/isolated/requests.jsonl
            evidence/detail/*.json
            evidence/detail/*.csv
            evidence/detail/*.png
            evidence/detail/*stderr.txt
            evidence/detail/isolated/requests.jsonl
            evidence/parity/*.json
            evidence/parity/*.csv
            evidence/parity/*.png
            evidence/parity/*stderr.txt
            evidence/parity/isolated/requests.jsonl
            evidence/surfaces/*.json
            evidence/surfaces/*.csv
            evidence/surfaces/*.png
            evidence/surfaces/*stderr.txt
            evidence/surfaces/isolated/requests.jsonl
            evidence/keyboard-legacy/*.json
            evidence/keyboard-legacy/*.csv
            evidence/keyboard-legacy/*.png
            evidence/keyboard-legacy/*stderr.txt
            evidence/keyboard-legacy/isolated/requests.jsonl
            evidence/keyboard-per-key/*.json
            evidence/keyboard-per-key/*.csv
            evidence/keyboard-per-key/*.png
            evidence/keyboard-per-key/*stderr.txt
            evidence/keyboard-per-key/isolated/requests.jsonl
            evidence/navigation-value-control/*.json
            evidence/navigation-value-control/*.csv
            evidence/navigation-value-control/*.png
