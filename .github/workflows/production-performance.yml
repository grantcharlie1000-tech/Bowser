name: Production performance comparison
on:
  push:
    branches: ['performance/post-ui']
  pull_request:
    paths:
      - '.github/workflows/production-performance.yml'
      - 'benchmarks/production-*'
      - 'benchmarks/test-production-*'
      - 'benchmarks/*native-detail*'
      - 'benchmarks/scripts/production-*'
      - 'src/performance.rs'
      - 'src/engine/webview2.rs'
      - 'src/engine/mod.rs'
      - 'src/app.rs'
      - 'src/main.rs'
      - 'src/chrome_host/assets.rs'
      - 'src/blocker.rs'
      - 'src/blocker/registration.rs'
      - 'benchmarks/scripts/filter-parity-fixture.mjs'
      - 'src/chrome_host/host.rs'
      - 'src/win32/window.rs'
      - 'ui/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: production-baseline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  baseline:
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      INTERACTION_DIAGNOSTIC_ONLY: 'true'
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve fingerprinted bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          path: candidate
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact event checkout and unchanged product inputs
        working-directory: candidate
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if((git rev-parse HEAD).Trim() -cne $env:EVENT_SOURCE){throw 'Unexpected merge/source checkout'}
          git fetch --no-tags --depth=1 origin f285525d205b9b388ebb26481f5af01d4df99ac8
          if($LASTEXITCODE -ne 0){throw 'Cannot fetch reviewed product source'}
          $changes=@(git diff --name-only f285525d205b9b388ebb26481f5af01d4df99ac8 HEAD)
          if($LASTEXITCODE -ne 0){throw 'Cannot verify bounded interaction instrumentation'}
          if(@($changes | Where-Object {$_ -cnotin @('.github/workflows/production-performance.yml','benchmarks/production-baseline.ps1','benchmarks/production-analyze.py','benchmarks/interaction-diagnostic.md','benchmarks/production-focus.psm1','benchmarks/test-production-focus.ps1','benchmarks/native-focus-diagnostic.md','benchmarks/controller-focus-diagnostic.md','benchmarks/focus-topology-diagnostic.md','src/performance.rs','src/main.rs','src/app.rs','src/chrome_host/host.rs','src/engine/mod.rs','src/engine/webview2.rs','src/chrome_host/protocol.rs','src/win32/window.rs','src/win32/settings_page.rs','ui/src/interaction-diagnostic.ts','ui/src/main.ts','ui/src/protocol.ts','ui/test/interaction-diagnostic.mjs','ui/package.json','ui/dist.manifest','ui/dist/app.js','ui/dist/settings-page.js','ui/dist/history-page.js')}).Count){throw 'Unexpected changes outside fixed interaction diagnostic slice'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Parse measurement scripts and run contract tests
        working-directory: candidate
        run: |
          foreach ($path in @('benchmarks/production-baseline.ps1','benchmarks/production-measurements.psm1','benchmarks/test-production-measurements.ps1','benchmarks/production-focus.psm1','benchmarks/test-production-focus.ps1')) {
            $tokens=$null; $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $pwd $path),[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count) { $errors | Format-List; throw "$path does not parse" }
          }
          ./benchmarks/test-production-measurements.ps1
          ./benchmarks/test-production-focus.ps1
          ./benchmarks/test-measurements.ps1
          python benchmarks/test-native-detail-analyze.py
          if ($LASTEXITCODE -ne 0) { throw 'Native detail analyzer contracts failed' }
          python benchmarks/test-production-analyze.py
          if ($LASTEXITCODE -ne 0) { throw 'Analysis contract tests failed' }
          node --check benchmarks/scripts/production-fixture-server.mjs
          node --check benchmarks/scripts/filter-parity-fixture.mjs
      - name: Reuse exact c6f93 controller-focus binaries for topology-only control
        working-directory: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $source='c6f93eac8d9003e91ba60ac0804bbed29acd14ad'
          git fetch --no-tags --depth=1 origin $source
          if($LASTEXITCODE -ne 0){throw 'Cannot fetch frozen controller source'}
          $changes=@(git diff --name-only $source HEAD)
          if($LASTEXITCODE -ne 0 -or @($changes|Where-Object {$_ -cnotin @('.github/workflows/production-performance.yml','benchmarks/production-baseline.ps1','benchmarks/production-focus.psm1','benchmarks/test-production-focus.ps1','benchmarks/focus-topology-diagnostic.md')}).Count){throw 'Topology control must be harness-only; no product drift or rebuild'}
          $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          $zip=Join-Path $env:RUNNER_TEMP 'controller-c6f93.zip'
          Invoke-WebRequest -Headers $headers -Uri 'https://api.github.com/repos/grantcharlie1000-tech/Bowser/actions/artifacts/12136361999/zip' -OutFile $zip
          $archiveHash=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if($archiveHash -cne '8ed7287f9fcdb71087fd61ee9bc256ea06bb4345c14beb37e5c3dce7864bdcfe'){throw 'Frozen controller archive digest mismatch'}
          $cache=Join-Path $env:RUNNER_TEMP 'controller-c6f93'
          Expand-Archive -LiteralPath $zip -DestinationPath $cache
          New-Item -ItemType Directory -Force ../evidence | Out-Null
          # Copy immutable executables/provenance only, never prior rows, profiles or isolation markers.
          foreach($folder in @('candidate','interaction-reference','frozen','reference')){Copy-Item (Join-Path $cache $folder) ../evidence/ -Recurse}
          Copy-Item (Join-Path $cache 'input-manifest.json') ../evidence/input-manifest.json
          $candidate=Get-Content ../evidence/candidate/identity.json -Raw | ConvertFrom-Json
          $reference=Get-Content ../evidence/interaction-reference/identity.json -Raw | ConvertFrom-Json
          if($candidate.source -cne $source -or $candidate.tree -cne '6fd425195b5ccf65214584552de1e2322f64f731' -or $candidate.sha256 -cne '40c68ab5ad01cfa30b1632f58047e5293b2d7c0f305c05e9be51b4d8a3aff905' -or $candidate.bytes -ne 7883264){throw 'Frozen matched candidate identity mismatch'}
          if($reference.source -cne 'tree:50708b8a05cd6f203503b1a83c6bee4f3dad4fc4' -or $reference.instrumentation_source -cne $source -or $reference.sha256 -cne 'ba569e18a2b6bf220805aad6de67ce3adc03d94ce48cbffd01ec2ca65b83147a' -or $reference.bytes -ne 7851008){throw 'Frozen matched reference identity mismatch'}
          $expected=[ordered]@{baseline='d0075f2807fd94000cb51ace647eaf335c71ab37c8302a91f0a52d3380dbe0fa';diagnostic='ba569e18a2b6bf220805aad6de67ce3adc03d94ce48cbffd01ec2ca65b83147a';release='341486070d2e74cf9a9e5d5fbeffa90c7dd2ec4fd36bc284a8a3878a7a9bcec1';candidate='40c68ab5ad01cfa30b1632f58047e5293b2d7c0f305c05e9be51b4d8a3aff905'}
          $manifest=Get-Content ../evidence/input-manifest.json -Raw | ConvertFrom-Json
          $paths=@{baseline='../evidence/frozen/untouched-main.exe';diagnostic='../evidence/interaction-reference/reference.exe';release='../evidence/frozen/released-v0.0.19.exe';candidate='../evidence/candidate/candidate.exe'}
          foreach($role in $expected.Keys){if($manifest.$role -cne $expected[$role] -or (Get-FileHash $paths[$role] -Algorithm SHA256).Hash.ToLowerInvariant() -cne $expected[$role]){throw "Frozen topology input mismatch: $role"}}
          if((Get-Item $paths.candidate).Length -ne 7883264 -or (Get-Item $paths.diagnostic).Length -ne 7851008){throw 'Frozen matched input size mismatch'}
          [ordered]@{artifact_id=12136361999;archive_sha256=$archiveHash;candidate_source=$source;reference_tree=$reference.build_tree;harness_source=(git rev-parse HEAD).Trim();candidate_rebuilt=$false;fixed_pairs=1;planned_rows=8;max_invalid_samples=20;purpose='One topology-only H1 discrimination: original toolbar CtrlL HWND versus alternate focus parent chains/rect/styles at existing boundaries';limits='Non-atomic ancestry/geometry cannot establish controller identity or exclude same-PID/TID handle reuse; unknown is a valid result; H2 overwrite untested';stop='One fixed8-row cohort; preserve failures, stop on identity/isolation loss; if topology ambiguous stop this investigation branch, no further replication or repair'} | ConvertTo-Json | Set-Content ../evidence/replication-provenance.json
      - name: Bounded native actual-module and HTML activation validity pass
        id: validity
        working-directory: candidate
        run: |
          $control=@{};if($env:INTERACTION_DIAGNOSTIC_ONLY -eq 'true'){$control=@{DiagnosticAutoUpdateOff=$true;ExpectedInputManifest='../evidence/input-manifest.json'}}
          ./benchmarks/production-baseline.ps1 -BaselineExe ../evidence/frozen/untouched-main.exe -DiagnosticExe ../evidence/interaction-reference/reference.exe -DiagnosticSource (Get-Content ../evidence/interaction-reference/identity.json -Raw | ConvertFrom-Json).source -ReleaseExe ../evidence/frozen/released-v0.0.19.exe -CandidateExe ../evidence/candidate/candidate.exe -CandidateSource (Get-Content ../evidence/candidate/identity.json -Raw | ConvertFrom-Json).source -Out ../evidence/validity @control -StartupOnly -Pairs 1 -Fixtures light -IdleSeconds 1 -MeasurementMode timing -MaxInvalidSamples 1
      - name: Corrected diagnostic-off untouched and logging-on off controls
        if: env.INTERACTION_DIAGNOSTIC_ONLY != 'true'
        working-directory: candidate
        run: |
          ./benchmarks/production-baseline.ps1 -BaselineExe ../evidence/frozen/untouched-main.exe -DiagnosticExe ../evidence/interaction-reference/reference.exe -DiagnosticSource (Get-Content ../evidence/interaction-reference/identity.json -Raw | ConvertFrom-Json).source -ReleaseExe ../evidence/frozen/released-v0.0.19.exe -Out ../evidence/controls -StartupOnly -Pairs 3 -Fixtures light -MeasurementMode timing -MaxInvalidSamples 1
      - name: Ten matched AB BA pairs fresh and reused primary startup timing
        if: env.INTERACTION_DIAGNOSTIC_ONLY != 'true'
        working-directory: candidate
        run: |
          ./benchmarks/production-baseline.ps1 -BaselineExe ../evidence/frozen/untouched-main.exe -DiagnosticExe ../evidence/interaction-reference/reference.exe -DiagnosticSource (Get-Content ../evidence/interaction-reference/identity.json -Raw | ConvertFrom-Json).source -ReleaseExe ../evidence/frozen/released-v0.0.19.exe -CandidateExe ../evidence/candidate/candidate.exe -CandidateSource (Get-Content ../evidence/candidate/identity.json -Raw | ConvertFrom-Json).source -Out ../evidence/timing -StartupOnly -Pairs 10 -Fixtures light -MeasurementMode timing -MaxInvalidSamples 1
      - name: Ten matched AB BA pairs fresh and reused primary settled resources
        if: env.INTERACTION_DIAGNOSTIC_ONLY != 'true'
        working-directory: candidate
        run: |
          ./benchmarks/production-baseline.ps1 -BaselineExe ../evidence/frozen/untouched-main.exe -DiagnosticExe ../evidence/interaction-reference/reference.exe -DiagnosticSource (Get-Content ../evidence/interaction-reference/identity.json -Raw | ConvertFrom-Json).source -ReleaseExe ../evidence/frozen/released-v0.0.19.exe -CandidateExe ../evidence/candidate/candidate.exe -CandidateSource (Get-Content ../evidence/candidate/identity.json -Raw | ConvertFrom-Json).source -Out ../evidence/resource -StartupOnly -Pairs 10 -Fixtures light -MeasurementMode resource -MaxInvalidSamples 1
      - name: Separate small detail arm confirms actual registration count and cost
        if: ${{ !cancelled() && env.INTERACTION_DIAGNOSTIC_ONLY != 'true' && steps.validity.outcome == 'success' }}
        working-directory: candidate
        run: |
          ./benchmarks/production-baseline.ps1 -BaselineExe ../evidence/frozen/untouched-main.exe -DiagnosticExe ../evidence/interaction-reference/reference.exe -DiagnosticSource (Get-Content ../evidence/interaction-reference/identity.json -Raw | ConvertFrom-Json).source -ReleaseExe ../evidence/frozen/released-v0.0.19.exe -CandidateExe ../evidence/candidate/candidate.exe -CandidateSource (Get-Content ../evidence/candidate/identity.json -Raw | ConvertFrom-Json).source -Out ../evidence/detail -StartupOnly -PositiveOnly -Pairs 2 -DiagnosticDetailPilot -Fixtures light -MeasurementMode timing -MaxInvalidSamples 1
      - name: Mandatory actual native request-dispatch parity including worker sources
        if: ${{ !cancelled() && env.INTERACTION_DIAGNOSTIC_ONLY != 'true' && steps.validity.outcome == 'success' }}
        working-directory: candidate
        run: |
          ./benchmarks/production-baseline.ps1 -BaselineExe ../evidence/frozen/untouched-main.exe -DiagnosticExe ../evidence/interaction-reference/reference.exe -DiagnosticSource (Get-Content ../evidence/interaction-reference/identity.json -Raw | ConvertFrom-Json).source -ReleaseExe ../evidence/frozen/released-v0.0.19.exe -CandidateExe ../evidence/candidate/candidate.exe -CandidateSource (Get-Content ../evidence/candidate/identity.json -Raw | ConvertFrom-Json).source -Out ../evidence/parity -StartupOnly -PositiveOnly -Pairs 1 -Fixtures filter-parity -MeasurementMode timing -MaxInvalidSamples 1
      - name: Mandatory independent native first-use interaction smoke
        if: ${{ !cancelled() && env.INTERACTION_DIAGNOSTIC_ONLY != 'true' && steps.validity.outcome == 'success' }}
        working-directory: candidate
        run: |
          ./benchmarks/production-baseline.ps1 -BaselineExe ../evidence/frozen/untouched-main.exe -DiagnosticExe ../evidence/interaction-reference/reference.exe -DiagnosticSource (Get-Content ../evidence/interaction-reference/identity.json -Raw | ConvertFrom-Json).source -ReleaseExe ../evidence/frozen/released-v0.0.19.exe -CandidateExe ../evidence/candidate/candidate.exe -CandidateSource (Get-Content ../evidence/candidate/identity.json -Raw | ConvertFrom-Json).source -IncludeSurfaceSmoke -PositiveOnly -Out ../evidence/surfaces -StartupOnly -Pairs 1 -Fixtures light -MeasurementMode timing -MaxInvalidSamples 1
      - name: Single fixed8-row native focus topology control
        if: ${{ !cancelled() && env.INTERACTION_DIAGNOSTIC_ONLY == 'true' && steps.validity.outcome == 'success' }}
        working-directory: candidate
        run: |
          ./benchmarks/production-baseline.ps1 -BaselineExe ../evidence/frozen/untouched-main.exe -DiagnosticExe ../evidence/interaction-reference/reference.exe -DiagnosticSource (Get-Content ../evidence/interaction-reference/identity.json -Raw | ConvertFrom-Json).source -ReleaseExe ../evidence/frozen/released-v0.0.19.exe -CandidateExe ../evidence/candidate/candidate.exe -CandidateSource (Get-Content ../evidence/candidate/identity.json -Raw | ConvertFrom-Json).source -IncludeSurfaceSmoke -SurfaceInputMethod uia-value -DiagnosticAutoUpdateOff -ExpectedInputManifest ../evidence/input-manifest.json -DiagnosticInteractionPilot -DiagnosticNativeFocus -DiagnosticControllerFocus -DiagnosticFocusTopology -PositiveOnly -Out ../evidence/interaction-order -StartupOnly -Pairs 1 -Fixtures light -MeasurementMode timing -MaxInvalidSamples 20
      - name: Derive descriptive paired statistics without accepting gains automatically
        if: always()
        working-directory: candidate
        run: |
          foreach($arm in @('validity','controls','timing','resource','detail','parity','surfaces','keyboard-legacy','keyboard-per-key','navigation-value-control','interaction-order')) {
            $folder="../evidence/$arm"
            if(Test-Path "$folder/environment.json") {
              python benchmarks/production-analyze.py $folder
              if($LASTEXITCODE -ne 0){throw "Analysis failed for $arm; raw samples remain preserved"}
              python benchmarks/native-detail-analyze.py $folder
              if($LASTEXITCODE -ne 0){throw "Native attribution analysis failed for $arm; raw samples remain preserved"}
            }
          }
      - name: Preserve raw samples and frozen executables, not disposable renderer caches
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-performance-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            evidence/frozen/
            evidence/replication-provenance.json
            evidence/original-control-provenance.json
            evidence/interaction-reference/
            evidence/input-manifest.json
            evidence/native-isolation-blocked.json
            evidence/candidate/
            evidence/reference/
            evidence/baseline-ui/
            evidence/surface-module-regressions.json
            evidence/validity/*.json
            evidence/validity/*.csv
            evidence/validity/*stderr.txt
            evidence/validity/*.png
            evidence/validity/isolated/requests.jsonl
            evidence/controls/*.json
            evidence/controls/*.csv
            evidence/controls/*stderr.txt
            evidence/controls/*.png
            evidence/controls/isolated/requests.jsonl
            evidence/timing/*.json
            evidence/timing/*.csv
            evidence/timing/*stderr.txt
            evidence/timing/*.png
            evidence/timing/isolated/requests.jsonl
            evidence/resource/*.json
            evidence/resource/*.csv
            evidence/resource/*stderr.txt
            evidence/resource/*.png
            evidence/resource/isolated/requests.jsonl
            evidence/detail/*.json
            evidence/detail/*.csv
            evidence/detail/*.png
            evidence/detail/*stderr.txt
            evidence/detail/isolated/requests.jsonl
            evidence/parity/*.json
            evidence/parity/*.csv
            evidence/parity/*.png
            evidence/parity/*stderr.txt
            evidence/parity/isolated/requests.jsonl
            evidence/surfaces/*.json
            evidence/surfaces/*.csv
            evidence/surfaces/*.png
            evidence/surfaces/*stderr.txt
            evidence/surfaces/isolated/requests.jsonl
            evidence/keyboard-legacy/*.json
            evidence/keyboard-legacy/*.csv
            evidence/keyboard-legacy/*.png
            evidence/keyboard-legacy/*stderr.txt
            evidence/keyboard-legacy/isolated/requests.jsonl
            evidence/keyboard-per-key/*.json
            evidence/keyboard-per-key/*.csv
            evidence/keyboard-per-key/*.png
            evidence/keyboard-per-key/*stderr.txt
            evidence/keyboard-per-key/isolated/requests.jsonl
            evidence/navigation-value-control/*.json
            evidence/navigation-value-control/*.csv
            evidence/navigation-value-control/*.png
            evidence/navigation-value-control/*stderr.txt
            evidence/navigation-value-control/isolated/requests.jsonl
            evidence/interaction-order/*.json
            evidence/interaction-order/*.csv
            evidence/interaction-order/*.png
            evidence/interaction-order/*stderr.txt
            evidence/interaction-order/isolated/requests.jsonl
          if-no-files-found: warn
          retention-days: 30
