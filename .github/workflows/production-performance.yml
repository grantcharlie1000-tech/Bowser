name: Production performance comparison
on:
  pull_request:
    paths:
      - '.github/workflows/production-performance.yml'
      - 'benchmarks/production-*'
      - 'benchmarks/test-production-*'
      - 'benchmarks/*native-detail*'
      - 'benchmarks/scripts/production-*'
      - 'src/performance.rs'
      - 'src/engine/webview2.rs'
      - 'src/engine/mod.rs'
      - 'src/app.rs'
      - 'src/main.rs'
      - 'src/chrome_host/assets.rs'
      - 'src/chrome_host/host.rs'
      - 'src/win32/window.rs'
      - 'ui/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: production-baseline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  baseline:
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve fingerprinted bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          path: candidate
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Parse measurement scripts and run contract tests
        working-directory: candidate
        run: |
          foreach ($path in @('benchmarks/production-baseline.ps1','benchmarks/production-measurements.psm1','benchmarks/test-production-measurements.ps1')) {
            $tokens=$null; $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $pwd $path),[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count) { $errors | Format-List; throw "$path does not parse" }
          }
          ./benchmarks/test-production-measurements.ps1
          ./benchmarks/test-measurements.ps1
          python benchmarks/test-native-detail-analyze.py
          if ($LASTEXITCODE -ne 0) { throw 'Native detail analyzer contracts failed' }
          python benchmarks/test-production-analyze.py
          if ($LASTEXITCODE -ne 0) { throw 'Analysis contract tests failed' }
          node --check benchmarks/scripts/production-fixture-server.mjs
      - name: Reuse and verify immutable binaries already built from the exact frozen sources
        working-directory: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The two baseline binaries remain frozen; the candidate is built separately below.
          git fetch --no-tags --depth=1 origin 8a60dca2ac7de6d369c9b65584fd621a7013f491
          if ($LASTEXITCODE -ne 0) { throw 'Cannot fetch immutable diagnostic source' }
          git fetch --no-tags --depth=1 origin 80eabd7ae6d421e61c81985c34023bfc824a2e58
          if ($LASTEXITCODE -ne 0) { throw 'Cannot fetch untouched source for instrumentation provenance' }
          # Native changes are explicit diagnostic-only inputs, never relabelled frozen bytes.
          $allowedNative=@('src/performance.rs','src/app.rs','src/engine/mod.rs','src/engine/webview2.rs','src/chrome_host/host.rs','src/win32/window.rs')
          $nativeChanges=@(git diff --name-only 8a60dca2ac7de6d369c9b65584fd621a7013f491 HEAD -- src)
          if($LASTEXITCODE -ne 0){throw 'Cannot verify diagnostic native source provenance'}
          $unexpectedNative=@($nativeChanges | Where-Object {$_ -cnotin $allowedNative})
          if($unexpectedNative.Count){throw "Unexpected native changes outside diagnostic slice: $unexpectedNative"}
          New-Item -ItemType Directory -Force ../evidence/candidate | Out-Null
          git diff 8a60dca2ac7de6d369c9b65584fd621a7013f491 HEAD -- src | Set-Content ../evidence/candidate/native-detail.patch
          if($LASTEXITCODE -ne 0){throw 'Cannot preserve diagnostic source patch'}
          [ordered]@{frozen_source='8a60dca2ac7de6d369c9b65584fd621a7013f491';candidate_source=(git rev-parse HEAD).Trim();allowed_native_paths=$allowedNative;actual_native_paths=$nativeChanges;scope='Diagnostic-only attribution; frozen EXEs remain immutable, candidate rebuilt and fingerprinted'} | ConvertTo-Json | Set-Content ../evidence/candidate/native-detail-provenance.json
          $zip=Join-Path $env:RUNNER_TEMP 'production-frozen-8a60dca.zip'
          $headers=@{ Authorization="Bearer $env:GH_TOKEN"; Accept='application/vnd.github+json'; 'X-GitHub-Api-Version'='2022-11-28' }
          Invoke-WebRequest 'https://api.github.com/repos/grantcharlie1000-tech/Bowser/actions/artifacts/12121088896/zip' -Headers $headers -OutFile $zip
          $archiveHash=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($archiveHash -cne '7067133916748c8726a74bf48a599834f82adadfebf6c0ef1c69f2afd763ccef') { throw 'Frozen binary archive digest mismatch' }
          Expand-Archive -LiteralPath $zip -DestinationPath ../evidence
          $frozen=Join-Path $pwd '../evidence/frozen'
          foreach ($entry in (Get-Content (Join-Path $frozen 'manifest.json') -Raw | ConvertFrom-Json)) {
            $path=Join-Path $frozen $entry.name
            if ((Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant() -cne $entry.sha256) { throw "Frozen input hash mismatch: $($entry.name)" }
            if ((Get-Item $path).Length -ne $entry.bytes) { throw "Frozen input size mismatch: $($entry.name)" }
          }
          git diff 80eabd7ae6d421e61c81985c34023bfc824a2e58 8a60dca2ac7de6d369c9b65584fd621a7013f491 -- src | Set-Content (Join-Path $frozen 'instrumentation.patch')
          if ($LASTEXITCODE -ne 0) { throw 'Cannot preserve instrumentation diff' }
          [ordered]@{archive_artifact_id=12121088896;archive_sha256=$archiveHash;diagnostic_source='8a60dca2ac7de6d369c9b65584fd621a7013f491';untouched_source='80eabd7ae6d421e61c81985c34023bfc824a2e58';harness_source=(git rev-parse HEAD).Trim();previous_source_tests='run39086719160, measurement module tests and Windows source check passed'} | ConvertTo-Json | Set-Content ../evidence/frozen/provenance.json
          # Reuse the already-built ACTUAL optimized candidate only for harness/test-only revisions.
          # This is not the pre-optimization diagnostic.exe: source and exact EXE hash remain explicit.
          $reuseSource='bc82c994afc80de4d717ca22b93f0dc47b015992'
          git fetch --no-tags --depth=1 origin $reuseSource
          if($LASTEXITCODE -ne 0){throw 'Cannot verify actual optimized candidate source'}
          $changes=@(git diff --name-only $reuseSource HEAD)
          if($LASTEXITCODE -ne 0){throw 'Cannot validate candidate build-input identity'}
          $productChanges=@($changes | Where-Object {-not $_.StartsWith('benchmarks/') -and -not $_.StartsWith('ui/test/') -and $_ -cne '.github/workflows/production-performance.yml'})
          if(-not $productChanges.Count) {
            $cachedZip=Join-Path $env:RUNNER_TEMP 'actual-ui-candidate-bc82c99.zip'
            Invoke-WebRequest 'https://api.github.com/repos/grantcharlie1000-tech/Bowser/actions/artifacts/12122339684/zip' -Headers $headers -OutFile $cachedZip
            if((Get-FileHash $cachedZip -Algorithm SHA256).Hash.ToLowerInvariant() -cne '19a931dce37ad6f954f909d4e2dd0e9d3899b073bb93a6d17a41448d6df0379c'){throw 'Actual candidate archive digest mismatch'}
            $cache=Join-Path $env:RUNNER_TEMP 'actual-ui-candidate-bc82c99'
            Expand-Archive -LiteralPath $cachedZip -DestinationPath $cache
            $identity=Get-Content (Join-Path $cache 'candidate/identity.json') -Raw | ConvertFrom-Json
            $candidate=Join-Path $cache 'candidate/candidate.exe'
            if($identity.source -cne $reuseSource -or $identity.sha256 -cne 'c06cac90eb1a0debfb3e71e462e31f4c080d4adadfda538f373cc4fe01ed55d7' -or (Get-FileHash $candidate -Algorithm SHA256).Hash.ToLowerInvariant() -cne $identity.sha256 -or (Get-Item $candidate).Length -ne $identity.bytes){throw 'Actual candidate identity mismatch'}
            Copy-Item (Join-Path $cache 'candidate') ../evidence/ -Recurse
            [ordered]@{build_source=$reuseSource;harness_source=(git rev-parse HEAD).Trim();archive_artifact_id=12122339684;archive_sha256='19a931dce37ad6f954f909d4e2dd0e9d3899b073bb93a6d17a41448d6df0379c';allowed_nonproduct_changes=$changes;product_changes=$productChanges;note='Exact already-built optimized candidate; source is not relabelled as harness revision'} | ConvertTo-Json | Set-Content ../evidence/candidate/reuse-provenance.json
          }
      - name: Verify actual diagnostic candidate and build when product inputs changed
        working-directory: candidate
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Pinned toolchain installation failed' }
          Push-Location ui
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Locked UI install failed' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'UI rebuild failed' }
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { throw 'UI typecheck failed' }
          npm run lint
          if ($LASTEXITCODE -ne 0) { throw 'UI lint failed' }
          $env:BOWSER_TEST_EDGE='C:/Program Files (x86)/Microsoft/Edge/Application/msedge.exe'
          if (-not (Test-Path $env:BOWSER_TEST_EDGE)) { $env:BOWSER_TEST_EDGE='C:/Program Files/Microsoft/Edge/Application/msedge.exe' }
          if (-not (Test-Path $env:BOWSER_TEST_EDGE)) { throw 'Edge required for actual all-surface module/CSP smoke' }
          # Compare actual browser module first-use costs with the exact frozen baseline assets.
          New-Item -ItemType Directory -Force ../../evidence/baseline-ui | Out-Null
          $archive=Join-Path $env:RUNNER_TEMP 'baseline-ui.tar'
          git -C .. archive --format=tar --output=$archive 8a60dca2ac7de6d369c9b65584fd621a7013f491 ui/dist
          if ($LASTEXITCODE -ne 0) { throw 'Cannot archive frozen baseline UI bytes' }
          tar -xf $archive -C ../../evidence/baseline-ui
          if ($LASTEXITCODE -ne 0) { throw 'Cannot extract frozen baseline UI bytes' }
          $env:BOWSER_UI_BASELINE_DIST=(Resolve-Path ../../evidence/baseline-ui/ui/dist).Path
          $env:BOWSER_UI_SURFACE_REPORT=Join-Path (Resolve-Path ../../evidence).Path 'surface-module-regressions.json'
          node --test test/hardening.mjs test/surface-modules.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Actual module/CSP smoke failed' }
          Pop-Location
          git diff --exit-code -- ui/src/icons.gen.ts ui/dist ui/dist.manifest
          if ($LASTEXITCODE -ne 0) { throw 'Committed assets are not reproducible' }
          if(Test-Path ../evidence/candidate/reuse-provenance.json) {
            Write-Host 'Reusing exact optimized native EXE after strict no-product-change and hash verification'
            exit 0
          }
          cargo +1.99.1 build --release --locked --bin bowser --features html-chrome-default
          if ($LASTEXITCODE -ne 0) { throw 'Actual candidate build failed' }
          New-Item -ItemType Directory -Force ../evidence/candidate | Out-Null
          Copy-Item target/release/bowser.exe ../evidence/candidate/candidate.exe
          Copy-Item Cargo.lock,ui/dist.manifest ../evidence/candidate/
          $file=Get-Item ../evidence/candidate/candidate.exe
          [ordered]@{source=(git rev-parse HEAD).Trim();tree=(git rev-parse 'HEAD^{tree}').Trim();sha256=(Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant();bytes=$file.Length;toolchain=(rustc +1.99.1 --version --verbose | Out-String);features='html-chrome-default';scope='diagnostic-only native attribution after reverting UI experiment; not a release'} | ConvertTo-Json | Set-Content ../evidence/candidate/identity.json
      - name: Bounded native actual-module and HTML activation validity pass
        id: validity
        working-directory: candidate
        run: |
          ./benchmarks/production-baseline.ps1 -BaselineExe ../evidence/frozen/untouched-main.exe -DiagnosticExe ../evidence/frozen/diagnostic.exe -ReleaseExe ../evidence/frozen/released-v0.0.19.exe -CandidateExe ../evidence/candidate/candidate.exe -CandidateSource (Get-Content ../evidence/candidate/identity.json -Raw | ConvertFrom-Json).source -Out ../evidence/validity -Pairs 1 -Fixtures light -IdleSeconds 1 -MeasurementMode timing -MaxInvalidSamples 1
      - name: Corrected diagnostic-off untouched and logging-on off controls
        working-directory: candidate
        run: |
          ./benchmarks/production-baseline.ps1 -BaselineExe ../evidence/frozen/untouched-main.exe -DiagnosticExe ../evidence/candidate/candidate.exe -DiagnosticSource (Get-Content ../evidence/candidate/identity.json -Raw | ConvertFrom-Json).source -ReleaseExe ../evidence/frozen/released-v0.0.19.exe -Out ../evidence/controls -Pairs 3 -Fixtures light -MeasurementMode timing -MaxInvalidSamples 1
      - name: Short matched native detail-on off attribution timing pilot
        working-directory: candidate
        run: |
          ./benchmarks/production-baseline.ps1 -BaselineExe ../evidence/frozen/untouched-main.exe -DiagnosticExe ../evidence/frozen/diagnostic.exe -ReleaseExe ../evidence/frozen/released-v0.0.19.exe -CandidateExe ../evidence/candidate/candidate.exe -CandidateSource (Get-Content ../evidence/candidate/identity.json -Raw | ConvertFrom-Json).source -Out ../evidence/timing -Pairs 3 -DiagnosticDetailPilot -Fixtures light -MeasurementMode timing -MaxInvalidSamples 1
      - name: Short matched native detail-on off attribution resource pilot
        working-directory: candidate
        run: |
          ./benchmarks/production-baseline.ps1 -BaselineExe ../evidence/frozen/untouched-main.exe -DiagnosticExe ../evidence/frozen/diagnostic.exe -ReleaseExe ../evidence/frozen/released-v0.0.19.exe -CandidateExe ../evidence/candidate/candidate.exe -CandidateSource (Get-Content ../evidence/candidate/identity.json -Raw | ConvertFrom-Json).source -Out ../evidence/resource -Pairs 3 -DiagnosticDetailPilot -Fixtures light -MeasurementMode resource -MaxInvalidSamples 1
      - name: Mandatory independent native first-use interaction smoke
        if: ${{ !cancelled() && steps.validity.outcome == 'success' }}
        working-directory: candidate
        run: |
          ./benchmarks/production-baseline.ps1 -BaselineExe ../evidence/frozen/untouched-main.exe -DiagnosticExe ../evidence/frozen/diagnostic.exe -ReleaseExe ../evidence/frozen/released-v0.0.19.exe -CandidateExe ../evidence/candidate/candidate.exe -CandidateSource (Get-Content ../evidence/candidate/identity.json -Raw | ConvertFrom-Json).source -IncludeSurfaceSmoke -PositiveOnly -Out ../evidence/surfaces -Pairs 1 -Fixtures light -MeasurementMode timing -MaxInvalidSamples 1
      - name: Derive descriptive paired statistics without accepting gains automatically
        if: always()
        working-directory: candidate
        run: |
          foreach($arm in @('validity','controls','timing','resource','surfaces')) {
            $folder="../evidence/$arm"
            if(Test-Path "$folder/environment.json") {
              python benchmarks/production-analyze.py $folder
              if($LASTEXITCODE -ne 0){throw "Analysis failed for $arm; raw samples remain preserved"}
              python benchmarks/native-detail-analyze.py $folder
              if($LASTEXITCODE -ne 0){throw "Native attribution analysis failed for $arm; raw samples remain preserved"}
            }
          }
      - name: Preserve raw samples and frozen executables, not disposable renderer caches
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-performance-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            evidence/frozen/
            evidence/candidate/
            evidence/baseline-ui/
            evidence/surface-module-regressions.json
            evidence/validity/*.json
            evidence/validity/*.csv
            evidence/validity/*stderr.txt
            evidence/validity/*.png
            evidence/validity/isolated/requests.jsonl
            evidence/controls/*.json
            evidence/controls/*.csv
            evidence/controls/*stderr.txt
            evidence/timing/*.json
            evidence/timing/*.csv
            evidence/timing/*stderr.txt
            evidence/resource/*.json
            evidence/resource/*.csv
            evidence/resource/*stderr.txt
            evidence/surfaces/*.json
            evidence/surfaces/*.csv
            evidence/surfaces/*.png
            evidence/surfaces/*stderr.txt
            evidence/surfaces/isolated/requests.jsonl
          if-no-files-found: warn
          retention-days: 30
