              $obj = $ref.object
              for ($depth = 0; $obj.type -ceq 'tag' -and $depth -lt 8; $depth++) { $obj = (Read-Api "git/tags/$($obj.sha)").object }
              if ($obj.type -cne 'commit' -or $obj.sha -cne $source) { throw 'Existing tag must target the original tested source; never retarget.' }
          }
          function Assert-Release($Release, [bool]$Draft) {
              if ($Release.id -ne $releaseId -or $Release.tag_name -cne $tag -or $Release.target_commitish -cne $source -or $Release.draft -ne $Draft -or $Release.prerelease) { throw 'Pinned release ID/tag/target/state mismatch.' }
              $assets = @($Release.assets)
              if ($assets.Count -ne 2) { throw 'Existing draft must have exactly the two pinned assets.' }
              $exe = @($assets | Where-Object { $_.name -ceq 'Bowser.exe' })
              $meta = @($assets | Where-Object { $_.name -ceq 'build-metadata.json' })
              if ($exe.Count -ne 1 -or $meta.Count -ne 1) { throw 'Unexpected asset names.' }
              if ($exe[0].id -ne $exeId -or $exe[0].size -ne 7795712 -or $exe[0].digest -cne "sha256:$exeHash" -or $exe[0].state -cne 'uploaded') { throw 'Existing executable asset identity mismatch.' }
              if ($meta[0].id -ne $metadataId -or $meta[0].size -ne 613 -or $meta[0].digest -cne "sha256:$metadataHash" -or $meta[0].state -cne 'uploaded') { throw 'Existing metadata asset identity mismatch.' }
          }
          # These are immutable ORIGINAL run/job/artifact IDs, never this recovery run's build.
          $run = Read-Api "actions/runs/$runId"
          if ($run.id -ne $runId -or $run.head_sha -cne $source -or $run.head_branch -cne 'main' -or $run.event -cne 'push' -or $run.status -cne 'completed' -or $run.run_attempt -ne 1 -or $run.workflow_id -ne 388026789 -or $run.path -cne '.github/workflows/release-v0.0.19.yml') { throw 'Original workflow run provenance mismatch.' }
          $job = Read-Api "actions/jobs/$jobId"
          if ($job.id -ne $jobId -or $job.run_id -ne $runId -or $job.head_sha -cne $source -or $job.name -cne 'verify' -or $job.status -cne 'completed' -or $job.conclusion -cne 'success') { throw 'Original full verification job did not pass on the pinned source.' }
          $artifact = Read-Api "actions/artifacts/$artifactId"
          if ($artifact.id -ne $artifactId -or $artifact.expired -or $artifact.size_in_bytes -ne 3631886 -or $artifact.name -cne "release-v0.0.19-$source-1" -or $artifact.digest -cne $artifactHash -or $artifact.workflow_run.id -ne $runId -or $artifact.workflow_run.head_sha -cne $source) { throw 'Original immutable candidate artifact mismatch.' }
          $candidate = Join-Path $env:RUNNER_TEMP 'bowser-v19-recovery-candidate'
          $entries = @(Get-ChildItem -LiteralPath $candidate -Force -Recurse)
          $expectedNames = @('Bowser.exe', 'build-metadata.json', 'native-smoke.json')
          if ($entries.Count -ne 3 -or @($entries | Where-Object PSIsContainer).Count -ne 0 -or @($entries | Where-Object { $expectedNames -cnotcontains $_.Name }).Count -ne 0) { throw 'Unexpected candidate artifact file set.' }
          Assert-File (Join-Path $candidate 'Bowser.exe') 7795712 $exeHash
          Assert-File (Join-Path $candidate 'build-metadata.json') 613 $metadataHash
          $m = Get-Content -LiteralPath (Join-Path $candidate 'build-metadata.json') -Raw | ConvertFrom-Json
          if ($m.repository -cne $repo -or $m.commit -cne $source -or $m.version -cne '0.0.19' -or $m.revision -ne 20 -or $m.tag -cne $tag -or $m.asset -cne 'Bowser.exe' -or $m.sha256 -cne $exeHash -or $m.bytes -ne 7795712 -or $m.features -cne 'html-chrome-default' -or $m.run_id -cne '39078462869' -or $m.run_attempt -cne '1' -or $m.smoke_passed -ne $true) { throw 'Pinned candidate build metadata mismatch.' }
