          Assert-TagIfPresent
          if (-not $publishing) {
              "Read-only immutable source/artifact/file/smoke and optional tag checks passed. Draft checks are reserved for the mandatory main-only publisher; no draft access or publication attempted." | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
              exit 0
          }
          Assert-Release (Read-Api "releases/$releaseId") $true
          # Download only the existing pinned draft asset IDs. No build, execution or asset overwrite.
          $downloaded = Join-Path $env:RUNNER_TEMP ("bowser-v19-existing-draft-" + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $downloaded | Out-Null
          $binaryHeaders = $headers.Clone()
          $binaryHeaders.Accept = 'application/octet-stream'
          Invoke-WebRequest -Uri "https://api.github.com/repos/$repo/releases/assets/$exeId" -Headers $binaryHeaders -OutFile (Join-Path $downloaded 'Bowser.exe')
          Invoke-WebRequest -Uri "https://api.github.com/repos/$repo/releases/assets/$metadataId" -Headers $binaryHeaders -OutFile (Join-Path $downloaded 'build-metadata.json')
          Assert-File (Join-Path $downloaded 'Bowser.exe') 7795712 $exeHash
          Assert-File (Join-Path $downloaded 'build-metadata.json') 613 $metadataHash
