          if ($publishing) {
              $body = @{ draft = $false; make_latest = 'false' } | ConvertTo-Json -Compress
              $null = Invoke-RestMethod -Method Patch -Uri "https://api.github.com/repos/$repo/releases/$releaseId" -Headers $headers -ContentType 'application/json' -Body $body
