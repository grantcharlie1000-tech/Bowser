<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="/pages/common.css"><title>hover</title></head><body>
<article class="item" id="card" data-expect="shield"><a id="user" href="/u/leaker" data-hover="1">leaker</a> <span class="sentinel">GTA 6 ending spoiler: the hero dies in the final mission</span></article>
<script>var pops=0;document.addEventListener('mouseover',function(e){var a=e.target.closest&&e.target.closest('a[data-hover]');if(a){setTimeout(function(){pops++;window.__pops=pops;var d=document.createElement('div');d.id='pop';d.textContent='profile card';document.body.appendChild(d);},60);}},false);
