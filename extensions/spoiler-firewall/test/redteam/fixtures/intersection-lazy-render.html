<!doctype html><html><head><meta charset="utf-8"><title>redteam intersection-lazy-render</title><style>body{margin:8px;font:16px/1.3 Arial,sans-serif;background:#fff;color:#222}.sentinel{color:#ff00ff!important;font:700 26px/1.2 Arial!important;-webkit-text-fill-color:#ff00ff}.item{border:1px solid #ccc;border-radius:10px;padding:10px 12px;margin:8px 0;background:#fafafa}.mag{color:#ff00ff;font:700 26px/1.2 Arial}.green{color:#00aa00;font:700 26px/1.2 Arial}</style></head><body><div style="height:900px">spacer</div><div id="lazy" class="item" style="min-height:60px"></div><script>var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.innerHTML='<span class=sentinel>GTA 6 ending spoiler: the hero dies in the final mission</span>';io.disconnect()}})});io.observe(document.getElementById('lazy'));setTimeout(function(){window.scrollTo(0,700)},300)</script></body></html>
