<!doctype html><html><head><meta charset="utf-8"><title>redteam dom-apis-mix</title><style>body{margin:8px;font:16px/1.3 Arial,sans-serif;background:#fff;color:#222}.sentinel{color:#ff00ff!important;font:700 26px/1.2 Arial!important;-webkit-text-fill-color:#ff00ff}.item{border:1px solid #ccc;border-radius:10px;padding:10px 12px;margin:8px 0;background:#fafafa}.mag{color:#ff00ff;font:700 26px/1.2 Arial}.green{color:#00aa00;font:700 26px/1.2 Arial}</style></head><body><article class="item" id="a1" ><div id='a'></div></article><article class="item" id="b1" ><div id='b'></div></article><article class="item" id="c1" ><div id='c'></div></article><article class="item" id="d1" ><div id='d'></div></article><article class="item" id="e1" ><div id='e'></div></article><article class="item" id="f1" ><div id='f'></div></article><script>var T="GTA 6 ending spoiler: the hero dies in the final mission";function mk(){var s=document.createElement('span');s.className='sentinel';s.textContent=T;return s}setTimeout(function(){document.getElementById('a').insertAdjacentHTML('beforeend','<span class=sentinel>'+T+'</span>');var b=document.getElementById('b');b.insertAdjacentText('afterbegin',T);b.className='sentinel';var c=document.getElementById('c');var r=document.createRange();r.selectNodeContents(c);r.insertNode(mk());document.getElementById('d').append(mk());var e=document.getElementById('e');e.outerHTML='<div id=e2 class=sentinel>'+T+'</div>';var f=document.getElementById('f');var fr=document.createDocumentFragment();fr.appendChild(mk());f.replaceChildren(fr)},250)</script></body></html>
