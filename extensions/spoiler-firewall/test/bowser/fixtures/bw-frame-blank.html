<!doctype html><html><head><meta charset="utf-8"><title>about:blank frames written by parent</title><style>body{margin:8px;font:16px/1.3 Arial,sans-serif;background:#fff;color:#222}.sentinel{color:#ff00ff!important;font:700 22px/1.2 Arial!important;-webkit-text-fill-color:#ff00ff}.item{border:1px solid #ccc;border-radius:10px;padding:10px 12px;margin:8px 0;background:#fafafa}iframe{border:1px solid #999;display:block;margin:6px 0}</style></head><body><p class="item" data-expect="clear">Parent page clean text.</p><iframe id="f1" src="about:blank" width="560" height="60"></iframe><iframe id="f2" width="560" height="60"></iframe><script>
var d2=document.getElementById('f2').contentDocument;d2.open();d2.write("<style>body{margin:0}.sentinel{color:#ff00ff;font:700 22px Arial}</style><p class=\"sentinel\" data-expect=\"shield\">GTA 6 ending spoiler: the hero dies in the final mission (sync write, no src)</p>");d2.close();
addEventListener('load',function(){var d=document.getElementById('f1').contentDocument;d.open();d.write("<style>body{margin:0}.sentinel{color:#ff00ff;font:700 22px Arial}</style><p class=\"sentinel\" data-expect=\"shield\">GTA 6 ending spoiler: the hero dies in the final mission (about:blank, after load)</p>");d.close();});
</script></body></html>
