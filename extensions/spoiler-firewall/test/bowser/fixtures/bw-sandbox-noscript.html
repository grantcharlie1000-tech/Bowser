<!doctype html><html><head><meta charset="utf-8"><title>sandboxed frames without scripts</title><style>body{margin:8px;font:16px/1.3 Arial,sans-serif;background:#fff;color:#222}.sentinel{color:#ff00ff!important;font:700 22px/1.2 Arial!important;-webkit-text-fill-color:#ff00ff}.item{border:1px solid #ccc;border-radius:10px;padding:10px 12px;margin:8px 0;background:#fafafa}iframe{border:1px solid #999;display:block;margin:6px 0}</style></head><body><p class="item" data-expect="clear">Parent page clean text.</p>
