[package]
name = "bowser"
version = "0.0.34"
edition = "2024"
rust-version = "1.85"
description = "A minimal native Windows browser using the shared WebView2 runtime"

[dependencies]
url = "2.5"
psl = "2.1"
zeroize = "1.8"
# Ed25519 verification of the signed spoiler term feed (src/spoiler_feed.rs). Pure Rust, no dependencies of its own
# with default features off; Windows CNG has no Ed25519 before Windows 11, and the updater uses P-256 there.
ed25519-compact = { version = "2.1", default-features = false }
webview2-com = "=0.39.1"
windows-core = "=0.62.2"
windows = { version = "0.62", features = ["Foundation", "Foundation_Collections", "Globalization", "Graphics_Imaging", "Media_Ocr", "Storage_Streams", "Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_Graphics_Imaging", "Win32_Networking_WinHttp", "Win32_Security_WinTrust", "Win32_Security_Cryptography", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Performance", "Win32_System_Power", "Win32_System_ProcessStatus", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_Variant", "Win32_Storage_FileSystem", "Win32_UI_Accessibility", "Win32_UI_HiDpi", "Win32_UI_Controls", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }
zip = { version = "=1.1.4", default-features = false, features = ["deflate"] }

[features]
# Makes the HTML/CSS/TypeScript chrome the default. `BOWSER_UI=native` still selects the GDI chrome
# and `BOWSER_UI=html` selects the HTML chrome in any build. Update-Bowser.ps1 builds with this on.
html-chrome-default = []
# Experimental generic engine-owned menu presentation. Never enabled by shipping defaults.
experimental-engine-context-menu = []

[[bin]]
name = "bowser"
path = "src/main.rs"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

