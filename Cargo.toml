[package]
name = "bowser"
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
description = "A minimal native Windows browser using the shared WebView2 runtime"

[dependencies]
url = "2.5"
psl = "2.1"
zeroize = "1.8"
webview2-com = "=0.39.1"
windows-core = "=0.62.2"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Imaging", "Win32_Networking_WinHttp", "Win32_Security_WinTrust", "Win32_Security_Cryptography", "Win32_System_Com", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Performance", "Win32_System_Power", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_UI_Accessibility", "Win32_UI_HiDpi", "Win32_UI_Controls", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[features]
# Makes the HTML/CSS/TypeScript chrome the default. `BOWSER_UI=native` still selects the GDI chrome
# and `BOWSER_UI=html` selects the HTML chrome in any build. Update-Bowser.ps1 builds with this on.
html-chrome-default = []

[[bin]]
name = "bowser"
path = "src/main.rs"

[profile.release]
lto = "thin"
codegen-units = 1

