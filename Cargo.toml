[package]
name = "bowser"
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
description = "A minimal native Windows browser using the shared WebView2 runtime"

[dependencies]
url = "2.5"
webview2-com = "=0.39.1"
windows-core = "=0.62.2"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Imaging", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Performance", "Win32_System_SystemInformation", "Win32_UI_HiDpi", "Win32_UI_Controls", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[[bin]]
name = "bowser"
path = "src/main.rs"

